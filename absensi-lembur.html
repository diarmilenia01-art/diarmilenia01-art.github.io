<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi &amp; Lembur - demo oleh Diar Azari</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ground:#E8ECF6; --card:#FFFFFF; --card-2:#F4F6FC; --ink:#101838; --ink-2:#3D4769; --muted:#6A7596;
  --line:#DDE3F1; --line-2:#C9D2E8;
  --navy:#14215A; --navy-2:#1E3182; --navy-ink:#FFFFFF; --navy-muted:#AFC0F2; --navy-line:rgba(255,255,255,.14);
  --accent:#2F55D4; --accent-ink:#FFFFFF; --accent-soft:#E3EAFD;
  --ok:#17875F; --ok-soft:#DDF3EA; --warn:#B86E00; --warn-soft:#FDF0D8; --bad:#C43B36; --bad-soft:#FBE3E1;
  --info:#2C6FB0; --info-soft:#E1EDF9; --flag:#6D4BD8; --flag-soft:#ECE6FD; --off:#8B94AE; --off-soft:#EEF0F5;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --heat-h:#CFDCF7;
  --shadow:0 1px 2px rgba(16,24,56,.06),0 8px 24px -12px rgba(16,24,56,.18);
  --radius:18px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#090E20; --card:#111934; --card-2:#172142; --ink:#E9EDFB; --ink-2:#C0C8E4; --muted:#8F9AC0;
  --line:#233058; --line-2:#2E3D6B;
  --navy:#0F1A4A; --navy-2:#1A2C77; --navy-muted:#9FB2EE;
  --accent:#6E8CFF; --accent-ink:#0A1030; --accent-soft:#1D2A5C;
  --ok:#45C28F; --ok-soft:#123A2C; --warn:#F0AE45; --warn-soft:#3B2B0E; --bad:#F07A73; --bad-soft:#431A1A;
  --info:#7FB2EA; --info-soft:#15304D; --flag:#A792FF; --flag-soft:#2A2152; --off:#6F7A9E; --off-soft:#1B2446;
  --heat-h:#2A3F7A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#090E20; --card:#111934; --card-2:#172142; --ink:#E9EDFB; --ink-2:#C0C8E4; --muted:#8F9AC0;
  --line:#233058; --line-2:#2E3D6B;
  --navy:#0F1A4A; --navy-2:#1A2C77; --navy-muted:#9FB2EE;
  --accent:#6E8CFF; --accent-ink:#0A1030; --accent-soft:#1D2A5C;
  --ok:#45C28F; --ok-soft:#123A2C; --warn:#F0AE45; --warn-soft:#3B2B0E; --bad:#F07A73; --bad-soft:#431A1A;
  --info:#7FB2EA; --info-soft:#15304D; --flag:#A792FF; --flag-soft:#2A2152; --off:#6F7A9E; --off-soft:#1B2446;
  --heat-h:#2A3F7A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
:where(svg[viewBox="0 0 24 24"]:not([width])){width:18px;height:18px;flex:none}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{background:var(--ground)}
body{margin:0;font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:18px 40px}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.page{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.shell{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
@media (max-width:1100px){.shell{grid-template-columns:minmax(0,1fr)}}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--navy);display:grid;place-items:center;
  color:#fff;flex:none;font-weight:800;font-size:13px;letter-spacing:-.04em}
.brand h1{font-size:18px;font-weight:800;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.who{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);font-size:12.5px}
.role-chip{font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}

/* tabs */
.tabs{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--ink-2);
  cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab svg{width:16px;height:16px;stroke-width:1.9}
.tab:hover{background:var(--card-2)}
.tab[aria-selected="true"]{background:var(--navy);color:#fff}
.tab .badge{background:var(--flag);color:#fff;border-radius:999px;padding:0 6px;font-size:11px;line-height:17px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-h h2{font-size:15px;font-weight:700}
.card-h .sub{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 24px;color:#fff;
  background:radial-gradient(120% 140% at 100% 0%,#3558D8 0%,transparent 55%),
             linear-gradient(135deg,#1A2A78 0%,#0F1A4A 70%);
  box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.hero-top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}
.hero h2{font-size:20px;font-weight:700}
.hero .cap{color:#C9D5FF;font-size:12.5px;margin-top:4px}
.period-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 8px 4px 12px;font-size:12.5px}
.period-pill select{background:transparent;border:0;color:#fff;font-weight:700;padding:4px;cursor:pointer}
.period-pill select option{color:#101838}
.hero-mid{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;justify-content:space-between}
.hero .big{font-size:54px;font-weight:800;letter-spacing:-.03em;line-height:1}
.hero .big small{font-size:21px;font-weight:700;margin-left:3px}
.hero-stats{display:flex;flex-wrap:wrap;gap:22px}
.hero-stats div{min-width:92px}
.hero-stats b{display:block;font-size:20px;font-weight:800}
.hero-stats span{font-size:11.5px;color:#C9D5FF}
@media (max-width:640px){.hero .big{font-size:42px}}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  display:flex;flex-direction:column;gap:3px}
.kpi .v{font-size:20px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .d{font-size:11.5px;color:var(--ink-2)}

/* side */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);
  background:linear-gradient(180deg,var(--navy-2),var(--navy));color:var(--navy-ink);border-radius:24px;
  padding:20px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow);min-width:0}
@media (max-width:1100px){.side{position:static}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.side .eyebrow{color:var(--navy-muted)}
.side-big{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.side-sub{color:var(--navy-muted);font-size:12.5px}
.side-row{display:flex;gap:14px}
.side-row>div{flex:1;border-top:1px solid var(--navy-line);padding-top:10px}
.side-row b{display:block;font-size:16px}
.side-row span{font-size:11.5px;color:var(--navy-muted)}
.team-list{display:flex;flex-direction:column;gap:0}
.team-item{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--navy-line)}
.team-item:last-child{border-bottom:0}
.team-dot{width:10px;height:10px;border-radius:3px}
.team-item .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-item .mt{font-size:11.5px;color:var(--navy-muted)}
.team-item .rp{font-weight:700;font-size:13px;text-align:right}
.side-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:rgba(255,255,255,.08);
  border-radius:18px;padding:8px}
.side-actions button{border:0;background:transparent;color:#fff;border-radius:12px;padding:10px 4px;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;cursor:pointer}
.side-actions button:hover{background:rgba(255,255,255,.12)}
.side-actions button[disabled]{opacity:.4;cursor:not-allowed}
.side-actions svg{width:20px;height:20px;stroke-width:1.9}
.hol-list{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.hol-list div{display:flex;justify-content:space-between;gap:8px}
.hol-list span{color:var(--navy-muted)}
.pending-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:rgba(240,174,69,.16);border:1px solid rgba(240,174,69,.4);border-radius:12px;
  padding:10px 12px;font-size:12.5px}
.pending-chip button{background:#F0AE45;color:#2A1A00;border:0;border-radius:8px;font-weight:700;
  padding:5px 10px;cursor:pointer}

/* heatmap */
.heat-wrap{overflow:auto;max-height:540px;border:1px solid var(--line);border-radius:12px}
.heat{border-collapse:separate;border-spacing:2px;font-size:10.5px}
.heat th{position:sticky;top:0;background:var(--card);z-index:2;font-weight:600;color:var(--muted);
  padding:2px 0;min-width:20px}
.heat th.nm,.heat td.nm{position:sticky;left:0;background:var(--card);z-index:3;text-align:left;
  padding:0 8px 0 6px;white-space:nowrap;font-weight:600;color:var(--ink-2);font-size:11.5px;min-width:100px}
.heat th.nm{z-index:4}
.heat th.we{color:var(--bad)}
.heat th.hol{color:#fff;background:var(--bad);border-radius:4px}
.heat td.c{width:20px;height:20px;border-radius:4px;text-align:center;font-weight:700;font-size:10px;
  cursor:pointer;line-height:20px}
.heat td.c:hover{outline:2px solid var(--accent)}
.c-H{background:var(--heat-h);color:transparent}
.c-T{background:var(--warn);color:#fff}
.c-TH,.c-A{background:var(--bad);color:#fff}
.c-S,.c-I{background:var(--bad-soft);color:var(--bad)}
.c-C{background:var(--info-soft);color:var(--info)}
.c-K{background:var(--flag-soft);color:var(--flag)}
.c-B{background:var(--ok-soft);color:var(--ok)}
.c-O,.c-L{background:var(--off-soft);color:var(--off)}
.c-X{background:transparent;color:var(--off)}
.c-V{background:var(--flag);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl-scroll{max-height:620px;overflow:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:12.5px}
.tbl th{background:var(--card-2);text-align:left;font-weight:700;color:var(--ink-2);padding:9px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--card-2)}
.tbl tfoot td{font-weight:800;background:var(--card-2);border-top:1px solid var(--line-2)}
.tbl .dim{color:var(--muted)}
.tbl .nm{font-weight:600;white-space:nowrap}
.tbl input,.tbl select{width:100%;min-width:70px;border:1px solid var(--line);background:var(--card);
  border-radius:8px;padding:5px 7px;font-size:12.5px}

/* pills, bars */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;
  font-weight:700;white-space:nowrap;background:var(--card-2);color:var(--ink-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.off{background:var(--off-soft);color:var(--off)}
.pill.flag{background:var(--flag-soft);color:var(--flag)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:8px;background:var(--card-2);
  border:1px solid var(--line);padding:2px 8px;font-size:11.5px;margin:1px 2px 1px 0;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.bar .track{height:10px;background:var(--card-2);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;border-radius:999px;background:var(--accent)}
.bar b{font-weight:700}

/* forms */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--card);
  color:var(--ink);border-radius:10px;padding:8px 13px;font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--card-2)}
.btn svg{width:16px;height:16px;stroke-width:1.9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--ink-2)}
.field .hint{font-size:11.5px;color:var(--muted)}
.inp,.sel{border:1px solid var(--line-2);background:var(--card);border-radius:10px;padding:8px 10px;
  font-size:13.5px;width:100%;min-width:0}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.seg{display:inline-flex;background:var(--card-2);border:1px solid var(--line);border-radius:10px;
  padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 11px;font-weight:600;
  font-size:12.5px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,56,.12)}
.picker{border:1px solid var(--line);border-radius:12px;max-height:300px;overflow:auto;padding:8px}
.sugg{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:12px;padding:10px 12px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:12.5px}
.sugg b{font-size:15px}
.notice{border-radius:12px;padding:11px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--warn-soft);color:var(--ink)}
.notice.info{background:var(--info-soft);color:var(--ink)}
.notice.bad{background:var(--bad-soft);color:var(--ink)}
.notice.ok{background:var(--ok-soft);color:var(--ink)}
.notice svg{flex:none;width:18px;height:18px;margin-top:1px}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(9,14,32,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--card);width:min(980px,100%);height:100%;overflow:auto;padding:20px;
  padding-top:calc(20px + env(safe-area-inset-top,0px));
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:14px;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4)}
.drawer>*{flex:none}
.drawer-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.drawer-h h2{font-size:18px;font-weight:800}
.x{border:0;background:var(--card-2);border-radius:10px;width:34px;height:34px;display:grid;
  place-items:center;cursor:pointer;flex:none}
.mini-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.mini-stats div{background:var(--card-2);border-radius:10px;padding:8px 10px}
.mini-stats b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.mini-stats span{font-size:11.5px;color:var(--muted)}

/* reports & import */
.rep-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rep-card{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--card);
  text-align:left;display:flex;flex-direction:column;gap:5px}
.rep-card b{font-size:13.5px}
.rep-card span{font-size:12px;color:var(--muted)}
.drop{border:2px dashed var(--line-2);border-radius:16px;padding:26px;text-align:center;display:flex;
  flex-direction:column;gap:10px;align-items:center;background:var(--card-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop{padding:18px 20px;flex-direction:row;justify-content:center;text-align:left;gap:14px;flex-wrap:wrap}
.drop>svg{width:30px;height:30px;color:var(--accent);stroke-width:1.8}
.drop input[type=file]{font-size:12.5px;max-width:100%}
.search{position:relative;display:flex;align-items:center}
.search>svg{position:absolute;left:10px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.search .inp{padding-left:32px}
.x svg{width:18px;height:18px}
/* loading */
.load-ov{position:fixed;inset:0;z-index:80;background:rgba(9,14,32,.5);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:20px;animation:fadeIn .15s ease-out}
.load-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  width:min(380px,100%);padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.load-fp{position:relative;width:64px;height:64px;border-radius:18px;background:var(--navy);color:#fff;
  display:grid;place-items:center;overflow:hidden}
.load-fp svg{width:36px;height:36px;position:relative;z-index:1}
.load-fp::after{content:"";position:absolute;left:0;right:0;height:14px;
  background:linear-gradient(180deg,transparent,rgba(120,160,255,.85),transparent);animation:scan 1.3s ease-in-out infinite}
@keyframes scan{0%{top:-14px}100%{top:64px}}
.load-t{font-weight:700;font-size:15px}
.load-s{font-size:12.5px;color:var(--muted);min-height:18px}
.load-bar{width:100%;height:8px;border-radius:999px;background:var(--card-2);overflow:hidden}
.load-bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--accent);transition:width .25s ease}
.load-steps{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left;font-size:12.5px}
.load-steps div{display:flex;gap:8px;align-items:center;color:var(--muted)}
.load-steps div.on{color:var(--ink);font-weight:600}
.load-steps div.done{color:var(--ok)}
.load-steps b{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;font-size:10px}
.load-steps div.on b{border-color:var(--accent);border-top-color:transparent;animation:sp .8s linear infinite}
.load-steps div.done b{border-color:var(--ok);background:var(--ok);color:#fff}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.pill svg{width:12px;height:12px}
.rek-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rek-card{border:1px solid var(--line);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.rek-card .btn{justify-content:center}
.pill .team-dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.muted{color:var(--muted)}
.small{font-size:12px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;
  box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
.boot{display:grid;place-items:center;min-height:70vh;gap:12px;color:var(--muted)}
.spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{.tabs,.side,.topbar{display:none}.shell{grid-template-columns:1fr}}

<script>

(function (root) {
'use strict';

/* --- hari libur nasional 2026 (SKB 3 Menteri, tanpa cuti bersama) --------- */
var LIBUR_2026 = {

  '2026-02-17': 'Tahun Baru Imlek 2577',

  '2026-06-01': 'Hari Lahir Pancasila',
  '2026-06-16': 'Tahun Baru Islam 1448 H',

  '2026-08-25': 'Maulid Nabi Muhammad saw.',
  '2026-12-25': 'Kelahiran Yesus Kristus'

var DEFAULT_RULES = {
  toleransiMenit: 15,
  tierTelat: [
    { sampai: 30,  potongan: 5000 },
    { sampai: 60,  potongan: 10000 },
    { sampai: 180, potongan: 20000 }
  ],
  batasDianggapTidakHadir: 180,
  telatEkstremSebagai: 'tidakhadir',      // 'tidakhadir' | 'alpa'
  tebusan: { aktif: true, maksTelat: 60 },
  potongan: {
    tidakhadir: { Leader: 20000, Staff: 10000 },
    alpa:       { Leader: 30000, Staff: 15000 }
  },
  liburNasionalBebasPotong: true,
  lupaScanDipotong: false,
  tanpaKeteranganDipotong: false,
  // Cuti (kode C) dan dinas luar (kode K) dihitung terpisah untuk rekap kehadiran
  ketCuti: ['CUTI', 'MELAHIRKAN'],
  cutiDipotong: true,            // cuti dipotong dengan tarif yang sama seperti izin/sakit
  cutiTanpaPotong: [],           // keterangan cuti yang dikecualikan dari potongan, mis. MELAHIRKAN
  ketDinas: ['DINAS', 'TUGAS LUAR', 'SEMINAR', 'DI GUDANG A', 'GUDANG C', 'QC', 'VISIT',
             'KUNJUNGAN', 'TRAINING', 'PELATIHAN'],
  bebasPotong: ['CUTI', 'POTONG CUTI', 'OFF', 'DI GUDANG A', 'KE GUDANG A', 'GUDANG C', 'QC',
                'SEMINAR', 'TUGAS LUAR', 'TUKER OFF', 'TUKAR OFF', 'GANTI OFF',
                'GANTI LIBUR', 'LIBUR', 'DINAS', 'MENINGGAL', 'WFH', 'PARTIME',
                'PART TIME', 'PARTTIME', 'RESIGN'],
  telatBebasJikaAdaKeterangan: true,
  ketTidakMemaafkanTelat: ['ADJUS', 'TELAT', 'TERLAMBAT', 'KESIANGAN'],
  bebasTelat: ['BALAS CHAT', 'HARI BESAR', 'IJIN', 'IZIN', 'LIVE SIANG', 'LIVE MALAM',
               'PARTIME', 'PART TIME', 'PARTTIME', 'DISURUH', 'KE BANK'],
  shiftDefault: {
    Leader: { normal: ['09:00', '18:00'], akhirpekan: ['09:00', '15:00'] },
    Staff:  { normal: ['09:00', '18:00'], akhirpekan: ['09:00', '15:00'] }
  },
  shiftDept: {},        // { "Live": { normal:["11:30","21:00"], akhirpekan:[...] } }
  pakaiJamMesin: true,
  lembur: {
    tarif: { Cycling: 28900, Apparel: 28900, Aksesori: 28900, LIVE: 40500 },
    uangMakan: { nominal: 15000, minJam: 3 },
    targetResi: { normal: 200, akhirpekan: 125, libur: 125 },
    resiPerJam: 25,
    dariAbsensi: {
      minMenitSore: 60,          // pulang minimal sekian menit lewat jadwal
      minMenitPagi: 30,          // datang minimal sekian menit sebelum jadwal
      gabungPatokan: 'min',      // 'min' | 'rata'
      tim: {
        Cycling:  { dept: 'Gudang A', arah: 'sore', patokan: ["Agus", "Sari"] },
        Aksesori: { dept: 'Gudang C', arah: 'sore', patokan: ["Putri", "Putri"] },
        Apparel:  { dept: 'Gudang B', arah: 'pagi', patokan: ["Maya", "Andi"] }
      }
    }
  }
};

/* --- util ---------------------------------------------------------------- */
function toMin(t) {
  if (!t) return null;
  var p = String(t).split(':');
  if (p.length < 2) return null;
  var h = parseInt(p[0], 10), m = parseInt(p[1], 10);
  if (isNaN(h) || isNaN(m)) return null;
  return h * 60 + m;
}
function fmtMin(n) {
  if (n == null) return '';
  var sign = n < 0 ? '-' : ''; n = Math.abs(n);
  return sign + String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
}
function rupiah(n) {
  return 'Rp ' + (Math.round(n || 0)).toLocaleString('id-ID');
}
function dow(iso) {                                   // 0=Minggu, selalu UTC
  var p = String(iso).split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay();
}
function msUTC(iso) { var p = String(iso).split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
function upper(x) { return String(x || '').toUpperCase(); }
function anyIn(hay, list) {
  var H = upper(hay);
  for (var i = 0; i < list.length; i++) if (H.indexOf(upper(list[i])) !== -1) return true;
  return false;
}
function deepMerge(base, over) {
  var out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  if (!over) return out;
  Object.keys(over).forEach(function (k) {
    var v = over[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && base && typeof base[k] === 'object' && !Array.isArray(base[k])) {
      out[k] = deepMerge(base[k], v);
    } else out[k] = v;
  });
  return out;
}

/* --- blok mingguan: 7 hari sejak tanggal mulai periode --- */
function blokMinggu(iso, mulai) {
  if (!mulai) return 1;
  return Math.floor((msUTC(iso) - msUTC(mulai)) / 86400000 / 7) + 1;
}

/* --- jenis hari ---------------------------------------------------------- */
function jenisHari(iso, libur) {
  if (libur && libur[iso]) return 'libur';
  var d = dow(iso);
  return (d === 0 || d === 6) ? 'akhirpekan' : 'normal';
}

/* --- shift efektif ------------------------------------------------------- */
function shiftEfektif(rec, emp, rules) {
  var jenis = rec._jenis === 'libur' ? 'akhirpekan' : rec._jenis;
  var dep = rules.shiftDept && rules.shiftDept[rec.dept];
  if (dep && dep[jenis] && dep[jenis][0]) return { in: dep[jenis][0], out: dep[jenis][1], src: 'dept' };
  if (rules.pakaiJamMesin && rec.shiftIn) return { in: rec.shiftIn, out: rec.shiftOut || '', src: 'mesin' };
  var def = (rules.shiftDefault[emp.jabatan] || rules.shiftDefault.Staff);
  var pair = def[jenis] || def.normal;
  return { in: pair[0], out: pair[1], src: 'skema' };
}

/* --- hitung satu hari ---------------------------------------------------- */
function hitungHari(rec, emp, rules, libur) {
  var out = {
    tgl: rec.tgl, nama: emp.nama, empId: emp.id, dept: rec.dept,
    jabatan: emp.jabatan, ket: rec.ket || '',
    scanIn: rec.scanIn, scanOut: rec.scanOut,
    jenis: null, shiftIn: '', shiftOut: '',
    telatMenit: 0, telatDihitung: 0, potonganTelat: 0,
    status: 'hadir', potonganHadir: 0, alasan: '', flag: '',
    tebus: 0, override: rec.override || null
  };
  out.jenis = rec._jenis = jenisHari(rec.tgl, libur);
  if (out.jenis === 'libur') out.namaLibur = libur[rec.tgl];

  var sh = shiftEfektif(rec, emp, rules);
  out.shiftIn = sh.in; out.shiftOut = sh.out; out.shiftSrc = sh.src;

  var ket = out.ket;
  var K = upper(ket);
  var adaScan = !!(rec.scanIn || rec.scanOut);

  /* ---- 1. hari tanpa scan sama sekali ---- */
  if (!adaScan) {
    if (!ket) {
      // tidak ada scan & tidak ada keterangan
      if (out.jenis === 'libur') { out.status = 'libur'; out.alasan = out.namaLibur; }
      else { out.status = 'perludicek'; out.flag = 'Tidak ada scan & tidak ada keterangan'; }
      return out;
    }
    if (anyIn(K, ['OFF']) && K.indexOf('TUKER') === -1 && K.indexOf('TUKAR') === -1) {
      out.status = 'off'; out.alasan = ket; return out;
    }
    if (anyIn(K, rules.ketCuti || [])) {
      out.status = 'cuti'; out.alasan = ket;
      if (rules.cutiDipotong && !anyIn(K, rules.cutiTanpaPotong || []))
        out.potonganHadir = rules.potongan.tidakhadir[emp.jabatan] || 0;
      return out;
    }
    if (anyIn(K, rules.ketDinas || [])) { out.status = 'dinas'; out.alasan = ket; return out; }
    // sisa daftar bebas potong (tukar off, ganti libur, dst) = hari off
    if (anyIn(K, rules.bebasPotong)) { out.status = 'off'; out.alasan = ket; return out; }
    if (out.jenis === 'libur' && rules.liburNasionalBebasPotong) {
      out.status = 'libur'; out.alasan = ket + ' (' + out.namaLibur + ')'; return out;
    }
    if (K.indexOf('ALPA') !== -1 || K.indexOf('ALPHA') !== -1) {
      out.status = 'alpa';
      out.potonganHadir = rules.potongan.alpa[emp.jabatan] || 0;
      out.alasan = ket; return out;
    }
    if (K.indexOf('SAKIT') !== -1 || K.indexOf('IJIN') !== -1 || K.indexOf('IZIN') !== -1) {
      out.status = K.indexOf('SAKIT') !== -1 ? 'sakit' : 'izin';
      out.potonganHadir = rules.potongan.tidakhadir[emp.jabatan] || 0;
      out.alasan = ket; return out;
    }
    out.status = 'perludicek'; out.flag = 'Keterangan belum dikenali: ' + ket;
    return out;
  }

  /* ---- 2. scan sebelah ---- */
  if (!rec.scanIn || !rec.scanOut) {
    out.status = 'perludicek';
    out.flag = !rec.scanIn ? 'Tidak scan masuk' : 'Tidak scan pulang';
    if (rules.lupaScanDipotong) {
      out.status = 'izin';
      out.potonganHadir = rules.potongan.tidakhadir[emp.jabatan] || 0;
    }
    if (!rec.scanIn) return out;
  }

  /* ---- 3. keterlambatan ---- */
  var mIn = toMin(rec.scanIn), mShift = toMin(sh.in);
  if (mIn != null && mShift != null && mIn > mShift) out.telatMenit = mIn - mShift;

  if (out.telatMenit > 0) {
    var ketMemaafkan = ket && !anyIn(ket, rules.ketTidakMemaafkanTelat || [])
      && (rules.telatBebasJikaAdaKeterangan || anyIn(ket, rules.bebasTelat));
    if (ketMemaafkan) {
      out.alasan = ket; out.telatDihitung = 0;
      out.flag = out.flag || '';
      out.bebasTelat = true;
    } else if (out.jenis === 'libur' && rules.liburNasionalBebasPotong) {
      out.bebasTelat = true; out.alasan = out.namaLibur;
    } else {
      out.telatDihitung = out.telatMenit;
      // tebusan: pulang lebih lama minimal sebanyak menit telat
      var mOut = toMin(rec.scanOut), mShiftOut = toMin(sh.out);
      if (rules.tebusan.aktif && mOut != null && mShiftOut != null) {
        out.tebus = Math.max(0, mOut - mShiftOut);
        if (out.telatMenit <= rules.tebusan.maksTelat && out.tebus >= out.telatMenit) {
          out.telatDihitung = 0; out.ditebus = true;
        }
      }
    }
  }

  if (out.telatDihitung > rules.batasDianggapTidakHadir) {
    var kat = rules.telatEkstremSebagai === 'alpa' ? 'alpa' : 'tidakhadir';
    out.status = 'telat-ekstrem';
    out.potonganHadir = rules.potongan[kat][emp.jabatan] || 0;
    out.alasan = 'Terlambat ' + out.telatDihitung + ' menit (> ' + rules.batasDianggapTidakHadir + ') - dihitung tidak hadir';
    out.telatDihitung = 0;
    return out;
  }

  if (out.telatDihitung > rules.toleransiMenit) {
    for (var i = 0; i < rules.tierTelat.length; i++) {
      if (out.telatDihitung <= rules.tierTelat[i].sampai) { out.potonganTelat = rules.tierTelat[i].potongan; break; }
    }
  }
  return out;
}

/* --- override manual HR -------------------------------------------------- */
function terapkanOverride(h, rules) {
  var ov = h.override;
  if (!ov) return h;
  var st = ov.status === 'bebas' ? 'dibebaskan' : ov.status;   // koreksi versi lama
  if (ov.bebasTelat) { h.potonganTelat = 0; h.telatDihitung = 0; h.ditebus = false; h.bebasTelat = true; }
  if (st) {
    h.status = st;
    var kat = st === 'alpa' ? 'alpa' : 'tidakhadir';
    var kenaPotong = ['sakit', 'izin', 'alpa'].indexOf(st) !== -1 ||
      (st === 'cuti' && rules.cutiDipotong && !anyIn(h.ket || '', rules.cutiTanpaPotong || []));
    h.potonganHadir = kenaPotong ? (rules.potongan[kat][h.jabatan] || 0) : 0;
    if (['cuti', 'dinas', 'dibebaskan'].indexOf(st) !== -1) { h.potonganTelat = 0; h.telatDihitung = 0; }
  }
  if (ov.bebasPotong) { h.potonganHadir = 0; }
  if (ov.potonganHadir != null) h.potonganHadir = ov.potonganHadir;
  if (ov.potonganTelat != null) h.potonganTelat = ov.potonganTelat;
  // kode B: HR membebaskan potongan (insiden di jalan, lupa scan yang dikonfirmasi, dst)
  if (st === 'dibebaskan' || ov.bebasTelat || ov.bebasPotong) h.dibebaskan = true;
  if (ov.catatan) h.catatan = ov.catatan;
  if (ov.kategori) h.kategoriCatatan = ov.kategori;
  h.diverifikasi = true;
  if (h.status === 'perludicek' && (st || ov.bebasPotong || ov.catatan)) h.flag = '';
  return h;
}

/* --- hitung lembur ------------------------------------------------------- */
function hitungLembur(entries, empByName, rules, libur) {
  var perOrang = {}, perTim = {}, rows = [];
  var makanHari = {};   // key nama|tgl -> total jam

  (entries || []).forEach(function (e) {
    if ((e.status || 'diajukan') !== 'disetujui') return;
    var jenis = jenisHari(e.tgl, libur);
    var tarif = e.tarif || rules.lembur.tarif[e.tim] || 28900;
    (e.peserta || []).forEach(function (nm) {
      var emp = empByName(nm);
      var key = emp ? emp.id : ('?' + nm);
      var nama = emp ? emp.nama : nm;
      var jamOrang = (e.jamPer && e.jamPer[nm] != null) ? +e.jamPer[nm] : (e.jam || 0);
      var nilai = jamOrang * tarif;
      var p = perOrang[key] || (perOrang[key] = {
        empId: emp ? emp.id : null, nama: nama, dept: emp ? emp.dept : '-',
        jam: 0, upah: 0, normal: 0, akhirpekan: 0, libur: 0, uangMakan: 0, hari: {}
      });
      p.jam += jamOrang; p.upah += nilai; p[jenis] += nilai;
      var mk = nama + '|' + e.tgl;
      makanHari[mk] = (makanHari[mk] || 0) + jamOrang;
      p.hari[e.tgl] = (p.hari[e.tgl] || 0) + jamOrang;
      perTim[e.tim] = (perTim[e.tim] || 0) + nilai;
      rows.push({ tgl: e.tgl, tim: e.tim, nama: nama, jenis: jenis, jam: jamOrang,
                  tarif: tarif, upah: nilai, ket: e.ket || '', entryId: e.id,
                  status: e.status || 'diajukan' });
    });
  });

  var um = rules.lembur.uangMakan;
  Object.keys(perOrang).forEach(function (k) {
    var p = perOrang[k], n = 0;
    Object.keys(p.hari).forEach(function (t) { if (p.hari[t] > um.minJam) n++; });
    p.jatahMakan = n; p.uangMakan = n * um.nominal;
    p.total = p.upah + p.uangMakan;
  });
  return { perOrang: perOrang, perTim: perTim, rows: rows };
}

/* --- usulan jam lembur ---
   min( selisih resi / (orang * resiPerJam) , median menit pulang lewat jadwal )
   dibulatkan ke kelipatan 0,5 jam. Jam final tetap diisi manual. --- */
function usulJamLembur(o) {
  var orang = (o.peserta || []).length;
  if (!orang) return { jam: 0, alasan: 'Belum ada orang dipilih.' };
  var kandidat = [], catatan = [];
  var selisih = (o.totalResi || 0) - (o.targetResi || 0);
  if (o.totalResi) {
    var dariResi = selisih / (orang * (o.resiPerJam || 25));
    kandidat.push(Math.max(0, dariResi));
    catatan.push('dari selisih resi ' + (selisih > 0 ? '+' : '') + selisih +
                 ' → ' + (Math.max(0, dariResi)).toFixed(2) + ' jam');
  }
  var lewat = (o.menitLewatJadwal || []).filter(function (m) { return m != null; })
                 .sort(function (a, b) { return a - b; });
  if (lewat.length) {
    var mid = Math.floor(lewat.length / 2);
    var med = lewat.length % 2 ? lewat[mid] : (lewat[mid - 1] + lewat[mid]) / 2;
    kandidat.push(Math.max(0, med / 60));
    catatan.push('median scan pulang lewat jadwal ' + Math.round(med) + ' menit → ' +
                 (med / 60).toFixed(2) + ' jam');
  }
  if (!kandidat.length) return { jam: 0, alasan: 'Butuh realisasi resi atau data scan pulang.' };
  var jam = Math.round(Math.min.apply(null, kandidat) * 2) / 2;
  return { jam: jam, alasan: catatan.join(' · ') + ' → diambil yang terkecil, dibulatkan 0,5 jam' };
}

/* --- rekomendasi lembur dari absensi ---
   Per tim per tanggal: kandidat = orang di departemen tim yang pulang lewat jadwal
   (arah 'sore') atau datang sebelum jadwal (arah 'pagi') minimal sekian menit.
   Jam tim mengikuti orang patokan; bila patokan tidak lembur, pakai median kandidat. --- */
function menitLembur(h, arah) {
  if (arah === 'pagi') {
    if (!h.scanIn || !h.shiftIn) return null;
    return toMin(h.shiftIn) - toMin(h.scanIn);
  }
  if (!h.scanOut || !h.shiftOut) return null;
  return toMin(h.scanOut) - toMin(h.shiftOut);
}
function median(a) {
  a = a.slice().sort(function (x, y) { return x - y; });
  var m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
function rekomendasiLembur(hari, rules) {
  var cfg = rules.lembur.dariAbsensi, out = [];
  Object.keys(cfg.tim).forEach(function (tim) {
    var t = cfg.tim[tim], batas = t.arah === 'pagi' ? cfg.minMenitPagi : cfg.minMenitSore;
    var pat = (t.patokan || []).map(function (x) { return upper(x); });
    var perTgl = {};
    hari.forEach(function (h) {
      if (h.dept !== t.dept) return;
      var m = menitLembur(h, t.arah);
      if (m == null || m < batas) return;
      (perTgl[h.tgl] = perTgl[h.tgl] || []).push({
        empId: h.empId, nama: h.nama, menit: m, patokan: pat.indexOf(upper(h.nama)) >= 0,

      var mp = k.filter(function (x) { return x.patokan; }).map(function (x) { return x.menit; });

      var menitTim = mp.length
        ? (cfg.gabungPatokan === 'rata' ? mp.reduce(function (a, b) { return a + b; }, 0) / mp.length

function prosesPeriode(opts) {

    if (h.status === 'libur') p.libur++;
    if (h.status === 'perludicek') p.perluDicek++;
    if (h.potonganTelat > 0) { p.hariTelat++; }
    p.menitTelat += h.telatDihitung || 0;
    p.potonganTelat += h.potonganTelat;
    p.potonganHadir += h.potonganHadir;

  Object.keys(lembur.perOrang).forEach(function (k) {
    var l = lembur.perOrang[k];
    if (perOrang[k]) { perOrang[k].lembur = l; }
  });

    potonganTelat: 0, potonganHadir: 0, totalPotongan: 0,
    upahLembur: 0, uangMakan: 0, jamLembur: 0, perluDicek: 0, hariTelat: 0
  };
  Object.keys(perOrang).forEach(function (k) {

    totals.perluDicek += p.perluDicek;
    totals.hariTelat += p.hariTelat;

    var l = lembur.perOrang[k];

  totals.totalLembur = totals.upahLembur + totals.uangMakan;

  return { rules: rules, libur: libur, hari: hari, perOrang: perOrang,
           lembur: lembur, totals: totals, empByName: empByName };
}

/* Data dari database datang terkunci (read-only). Selalu kembalikan salinan
   yang bisa diubah, supaya sort/push/assign di kode tidak pernah gagal. */
function salin(v){return v==null?v:JSON.parse(JSON.stringify(v));}
async function getDoc(path,def){
  if(!S.db) return MEM[path]!==undefined?salin(MEM[path]):def;
  try{var s=await S.db.doc(path).get();return s.exists?salin(s.data()):def;}
  catch(e){console.warn(e);return def;}
}
async function setDoc(path,data){
  if(!S.db){MEM[path]=salin(data);return true;}
  try{await S.db.doc(path).set(data);return true;}
  catch(e){toast(e&&e.code==='invalid_argument'
    ?'Tidak bisa menyimpan - akses Anda hanya untuk melihat.':'Gagal menyimpan. Coba lagi.','err');return false;}
}
async function delDoc(path){
  if(!S.db){delete MEM[path];return true;}
  try{await S.db.doc(path).delete();return true;}
  catch(e){if(e&&e.code==='not_found')return true;console.warn('delete',path,e);return false;}
}
function isHR(){return S.role==='hr';}
function canLembur(){return S.role==='hr'||S.role==='leader';}

function packRow(r){return {n:r.nama,t:r.tgl,k:r.jamKerja||'',a:r.shiftIn||'',b:r.shiftOut||'',
  i:r.scanIn||'',o:r.scanOut||'',d:r.dept||'',x:r.ket||''};}
function unpackRow(r){return {nama:r.n,tgl:r.t,jamKerja:r.k,shiftIn:r.a,shiftOut:r.b,
  scanIn:r.i,scanOut:r.o,dept:r.d,ket:r.x};}

async function loadConfig(){
  var c=await getDoc('config/rules',null);
  if(c&&c.rules) S.rules=A.deepMerge(A.DEFAULT_RULES,c.rules);
  if(c&&c.liburTambahan) S.liburTambahan=c.liburTambahan;
  var e=await getDoc('config/employees',null); S.employees=(e&&e.list)||[];
  var p=await getDoc('config/periods',null); S.periods=(p&&p.list)||[];
  if(!S.pid) S.pid=S.periods.length?S.periods[S.periods.length-1].id:null;
}
async function loadPeriod(pid){
  if(!pid){S.rows=[];S.ot=[];S.ov={};return;}
  var rows=[],i;
  for(i=0;i<DEPTS.length;i++){var d=await getDoc('att/'+pid+'/dept/'+slug(DEPTS[i]),null);
    if(d&&d.rows) rows=rows.concat(d.rows.map(unpackRow));}
  var ex=await getDoc('att/'+pid+'/dept/_lain',null);
  if(ex&&ex.rows) rows=rows.concat(ex.rows.map(unpackRow));
  S.rows=rows;
  var ot=[];
  for(i=0;i<TIMS.length;i++){var t=await getDoc('ot/'+pid+'/tim/'+slug(TIMS[i]),null);
    if(t&&t.entries) ot=ot.concat(t.entries);}
  S.ot=ot;
  var o=await getDoc('ov/'+pid,null); S.ov=(o&&o.byEmp)||{};
}
function compute(){
  var byName={};
  S.employees.forEach(function(e){byName[e.nama.toUpperCase()]=e;
    (e.alias||[]).forEach(function(a){byName[String(a).toUpperCase()]=e;});});
  var recs=S.rows.map(function(r){
    var e=byName[String(r.nama).toUpperCase()];
    var o=e&&S.ov[e.id]&&S.ov[e.id][r.tgl];
    return o?A.deepMerge(r,{override:o}):r;});
  S.res=A.prosesPeriode({employees:S.employees,records:recs,lembur:S.ot,
    rules:S.rules,liburTambahan:S.liburTambahan});
  return S.res;
}
async function reload(){await loadPeriod(S.pid);compute();render();}
function setBusy(b){document.body.style.cursor=b?'progress':'';}

/* daftar tanggal periode */
function tanggalPeriode(){
  var p=periodObj(); if(!p) return [];
  return daftarHari(p.start,p.end);
}
function wkOf(iso){var p=periodObj();return p?A.blokMinggu(iso,p.start):1;}

/* ---------------- drawer ---------------- */
function drawer(title,sub,bodyHtml,footHtml,onMount){
  closeDrawer();
  var w=document.createElement('div'); w.className='overlay'; w.id='drawer';
  w.innerHTML='<div class="drawer" role="dialog" aria-modal="true">'+
    '<div class="drawer-h"><div><h2>'+esc(title)+'</h2>'+
      (sub?'<p class="muted small" style="margin:4px 0 0">'+esc(sub)+'</p>':'')+'</div>'+
    '<button class="x" data-close aria-label="Tutup">'+icon('x')+'</button></div>'+
    bodyHtml+(footHtml?'<div class="row" style="justify-content:flex-end;margin-top:4px">'+footHtml+'</div>':'')+
    '</div>';
  document.body.appendChild(w);
  w.addEventListener('click',function(ev){if(ev.target===w)closeDrawer();});
  $$('[data-close]',w).forEach(function(b){b.onclick=closeDrawer;});
  if(onMount) onMount(w);
}
function closeDrawer(){var d=$('#drawer');if(d)d.remove();}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer();});

function tbl(head,rows,opt){
  opt=opt||{};
  var h=head.map(function(x){return typeof x==='object'?'<th class="n">'+esc(x.n)+'</th>':'<th>'+x+'</th>';}).join('');
  var b=rows.map(function(r){
    var cells=(r._cells||r).map(function(c){
      if(c&&typeof c==='object') return '<td class="n'+(c.b?' num':' num')+'"'+(c.b?' style="font-weight:700"':'')+'>'+c.n+'</td>';
      return '<td>'+c+'</td>';}).join('');
    return '<tr'+(r._attr||'')+'>'+cells+'</tr>';}).join('');
  var f=opt.foot?'<tfoot><tr>'+opt.foot.map(function(c){
    return typeof c==='object'?'<td class="n num">'+c.n+'</td>':'<td>'+c+'</td>';}).join('')+'</tr></tfoot>':'';
  return '<div class="tbl-wrap'+(opt.scroll?' tbl-scroll':'')+'"><table class="tbl"'+
    (opt.minw?' style="min-width:'+opt.minw+'px"':'')+'><thead><tr>'+h+'</tr></thead><tbody>'+b+'</tbody>'+f+'</table></div>';
}

      'Isi jam Live di Pengaturan agar angkanya benar.'+

        '<div><b class="num">'+t.hariTelat+'</b><span>hari telat dipotong</span></div>'+

      '</div></div>'+

    kpi('Potongan terlambat',rp(t.potonganTelat),t.hariTelat+' hari kena potongan')+
    kpi('Potongan tidak hadir',rp(t.potonganHadir),'S '+S_+' · I '+I_+' · A '+A_)+

function kpi(l,v,d){return '<div class="kpi"><span class="l">'+esc(l)+'</span><span class="v">'+esc(v)+

/* kode sel heatmap */
/* isi tooltip sel kalender: rincian scan per orang per hari */
function tipHari(p,h,k){
  var L=[];
  L.push(tglID(h.tgl)+' ('+hariID(h.tgl)+')');
  L.push(p.nama+' · '+h.dept+' · '+h.jabatan);
  L.push('');
  L.push('Scan masuk  : '+(h.scanIn||'tidak ada'));
  L.push('Scan pulang : '+(h.scanOut||'tidak ada'));
  L.push('Jadwal      : '+(h.shiftIn||'?')+' s.d. '+(h.shiftOut||'?'));
  if(h.telatMenit) L.push('Terlambat   : '+h.telatMenit+' menit'+
    (h.telatDihitung!==h.telatMenit?' (dihitung '+h.telatDihitung+' menit)':''));
  if(h.tebus) L.push('Pulang lewat: '+h.tebus+' menit'+(h.ditebus?', telat ditebus':''));
  L.push('');
  L.push('Status      : '+k[1]);
  if(h.ket) L.push('Keterangan  : '+h.ket);
  if(h.alasan&&h.alasan!==h.ket) L.push('Catatan     : '+h.alasan);
  if(h.flag) L.push('Perlu dicek : '+h.flag);
  if(h.catatan) L.push('Koreksi HR  : '+h.catatan);
  var pot=h.potonganTelat+h.potonganHadir;
  L.push('Potongan    : '+(pot?rp(pot):'tidak ada'));
  if(h.diverifikasi) L.push('(sudah diverifikasi HR)');
  return L.join('\n');
}
function kodeHari(h){
  if(h.status==='perludicek') return ['V','Perlu dicek'];
  if(h.status==='telat-ekstrem') return ['TH','Telat lewat batas → tidak hadir'];
  if(h.status==='alpa') return ['A','Alpha'];
  if(h.status==='sakit') return ['S','Sakit'];
  if(h.status==='izin') return ['I','Izin'];
  if(h.status==='cuti') return ['C','Cuti'];
  if(h.status==='dinas') return ['K','Dinas luar'];
  if(h.status==='dibebaskan'||h.status==='bebas'||h.dibebaskan) return ['B','Dibebaskan HR'];
  if(h.status==='off') return ['O','Off'];
  if(h.status==='libur') return ['L','Libur nasional'];
  if(h.potonganTelat>0) return ['T','Terlambat '+h.telatDihitung+' menit'];
  return ['H','Hadir'];
}
function heatmap(){
  var r=S.res,tgl=tanggalPeriode();
  if(!tgl.length) tgl=Array.from(new Set(S.rows.map(function(x){return x.tgl;}))).sort();
  var f=S.filter;
  var orang=Object.keys(r.perOrang).map(function(k){return r.perOrang[k];})
    .filter(function(p){return (!f.dept||p.dept===f.dept)&&
      (!f.q||p.nama.toLowerCase().indexOf(f.q.toLowerCase())>=0);})
    .sort(function(a,b){return a.dept.localeCompare(b.dept)||a.nama.localeCompare(b.nama);});
  var idx={}; r.hari.forEach(function(h){idx[h.empId+'|'+h.tgl]=h;});
  var head='<tr><th class="nm">Nama</th>'+tgl.map(function(d){
    var dw=A.dow(d),hol=r.libur[d];
    return '<th class="'+(hol?'hol':(dw===0||dw===6?'we':''))+'" title="'+esc(tglID(d)+(hol?'\n'+hol:''))+'">'+
      (+d.slice(8,10))+'</th>';}).join('')+'</tr>';
  var body=orang.map(function(p){
    return '<tr><td class="nm" title="'+esc(p.dept+' · '+p.jabatan)+'">'+esc(p.nama)+'</td>'+
      tgl.map(function(d){
        var h=idx[p.empId+'|'+d];
        if(!h) return '<td class="c c-X">·</td>';
        var k=kodeHari(h);
        return '<td class="c c-'+k[0]+'" data-cell="'+p.empId+'|'+d+'" title="'+
          esc(tipHari(p,h,k))+'">'+(k[0]==='H'?'':k[0].charAt(0))+'</td>';}).join('')+'</tr>';}).join('');
  var leg=[['c-H','Hadir'],['c-T','Terlambat'],['c-TH','Telat lewat batas'],['c-A','Alpha'],
           ['c-S','Sakit / izin'],['c-C','Cuti'],['c-K','Dinas luar'],['c-B','Dibebaskan HR'],
           ['c-O','Off / libur'],['c-V','Perlu dicek']];
  return '<div class="row" style="margin-bottom:10px">'+
      '<div class="field"><div class="search" style="min-width:190px">'+icon('search')+
        '<input class="inp" id="hq" placeholder="Cari nama" value="'+esc(f.q)+'"></div></div>'+
      '<div class="seg" id="hdept">'+[''].concat(DEPTS).map(function(d){
        return '<button data-hd="'+d+'" aria-pressed="'+(f.dept===d)+'">'+(d||'Semua')+'</button>';}).join('')+'</div>'+
    '</div>'+
    '<div class="heat-wrap"><table class="heat"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+
    '<div class="legend">'+leg.map(function(l){
      return '<span><i class="'+l[0]+'"></i>'+l[1]+'</span>';}).join('')+'</div>';
}
function bindHeat(){
  var q=$('#hq');
  if(q) q.oninput=function(){var v=this.value,p=this.selectionStart;S.filter.q=v;render();
    var el=$('#hq');if(el){el.focus();el.setSelectionRange(p,p);}};
  $$('[data-hd]').forEach(function(b){b.onclick=function(){S.filter.dept=b.dataset.hd;render();};});
  $$('[data-cell]').forEach(function(c){c.onclick=function(){

function vAbsensi(host){

    tbl(['Nama','Dept','Jabatan',{n:'Hadir'},{n:'S'},{n:'I'},{n:'A'},{n:'C'},{n:'K'},{n:'B'},{n:'Hari telat'},
        {n:'Pot. telat'},{n:'Pot. tdk hadir'},{n:'Total potongan'},{n:'Lembur'},'Verifikasi'],
      list.map(function(p){var l=p.lembur;
        return {_attr:' class="click" data-emp="'+p.empId+'"',_cells:[
          '<span class="nm">'+esc(p.nama)+'</span>','<span class="dim">'+esc(p.dept)+'</span>',

function jamOrangEntri(e,n){return (e.jamPer&&e.jamPer[n]!=null)?+e.jamPer[n]:(+e.jam||0);}
function totalEntri(e){return (e.peserta||[]).reduce(function(a,n){return a+jamOrangEntri(e,n)*(+e.tarif||0);},0);}
function totalJamEntri(e){return (e.peserta||[]).reduce(function(a,n){return a+jamOrangEntri(e,n);},0);}
/* jam yang benar-benar dibayar per orang. Catatan lama bisa menyimpan jam per orang
   yang berbeda dari kolom jam; kalau semuanya sama, angka itulah yang berlaku. */
function jamEfektif(e){
  var ps=e.peserta||[]; if(!ps.length) return +e.jam||0;
  var v=ps.map(function(n){return jamOrangEntri(e,n);});
  return v.every(function(x){return x===v[0];})?v[0]:null;
}
function jamLabel(e){var j=jamEfektif(e);
  return j==null?'<span title="jam berbeda antar orang">beragam</span>':String(j).replace('.',',');}
function fmtJam(x){return String(Math.round(x*100)/100).replace('.',',');}

/* durasi sesi live; sesi yang melewati tengah malam dihitung lanjut ke hari berikutnya */
function durasiJam(mulai,selesai){
  var a=A.toMin(mulai),b=A.toMin(selesai);
  if(a==null||b==null) return null;
  if(b<=a) b+=1440;
  return Math.round((b-a)/60*100)/100;
}

  var out=S.ot.filter(function(e){return e.tim==='LIVE';}).map(function(e){
    return {id:e.id,nama:(e.peserta||[])[0]||'',tgl:e.tgl,mulai:e.mulai||'',selesai:e.selesai||'',
            jam:+e.jam||0,mp:e.marketplace||'',tarif:+e.tarif||tarifLive(),simpan:true,asli:e};});
  out=out.concat(liveDraft);
  return out.sort(function(a,b){
    if(!a.tgl) return 1; if(!b.tgl) return -1;
    return a.tgl<b.tgl?-1:(a.tgl>b.tgl?1:String(a.mulai).localeCompare(String(b.mulai)));});

function cekLive(rows){
  var pesan={};
  var nama={};S.employees.forEach(function(e){nama[e.nama.toUpperCase()]=1;
    (e.alias||[]).forEach(function(a){nama[String(a).toUpperCase()]=1;});});
  var p=periodObj();
  rows.forEach(function(r,i){
    var w=[];
    if(r.nama&&!nama[r.nama.toUpperCase()]) w.push('nama tidak ada di master karyawan');
    if(r.tgl&&p&&(r.tgl<p.start||r.tgl>p.end)) w.push('tanggal di luar periode');
    if(r.nama&&r.tgl&&r.mulai){
      rows.forEach(function(o,j){
        if(j>=i||o.nama!==r.nama||o.tgl!==r.tgl) return;
        if(o.mulai===r.mulai&&o.selesai===r.selesai){w.push('baris kembar');return;}
        var a1=A.toMin(r.mulai),b1=a1+(r.jam||0)*60,a2=A.toMin(o.mulai),b2=a2+(o.jam||0)*60;
        if(a1!=null&&a2!=null&&a1<b2&&a2<b1) w.push('jam bentrok dengan sesi lain');});

      if(h&&h.status==='off') w.push('hari OFF di absensi');

  return pesan;

/* tempel dari Excel: kolom dikenali dari isinya, bukan dari urutannya saja */
async function tempelLive(teks){
  var nama={};S.employees.forEach(function(e){nama[e.nama.toUpperCase()]=e.nama;
    (e.alias||[]).forEach(function(a){nama[String(a).toUpperCase()]=e.nama;});});
  var mp={};MARKETPLACE.forEach(function(m){mp[m.toUpperCase().replace(/\s+/g,'')]=m;});
  var baris=teks.split(/\r?\n/).filter(function(x){return x.trim();});
  var masuk=0,lewat=0;
  for(var i=0;i<baris.length;i++){
    var sel=baris[i].split('\t').map(function(x){return x.trim();});
    var r={nama:'',tgl:'',mulai:'',selesai:'',mp:''};
    sel.forEach(function(v){
      if(!v) return;
      var U=v.toUpperCase().replace(/\s+/g,'');
      if(!r.mp&&mp[U]){r.mp=mp[U];return;}
      if(!r.nama&&nama[v.toUpperCase()]){r.nama=nama[v.toUpperCase()];return;}
      var jm=v.match(/^(\d{1,2})[:.](\d{2})/);
      if(jm&&+jm[1]<24){var t=String(+jm[1]).padStart(2,'0')+':'+jm[2];
        if(!r.mulai)r.mulai=t; else if(!r.selesai)r.selesai=t; return;}
      if(!r.tgl){var d=cellDate(v); if(d) r.tgl=d;}
    });
    r.jam=durasiJam(r.mulai,r.selesai)||0;
    if(!r.nama||!r.tgl||!(r.jam>0)){lewat++;continue;}
    r.id='LV'+Date.now().toString(36)+i+Math.random().toString(36).slice(2,5);
    r.tarif=tarifLive();
    await simpanLive(r,true);
    masuk++;
  }
  await reload();
  toast(masuk+' baris ditempel'+(lewat?', '+lewat+' baris dilewati karena nama, tanggal, atau jamnya tidak terbaca':'')+'.',
    lewat?'err':'ok');
}
async function simpanLive(r,tanpaMuat){
  var rec={id:r.id,tim:'LIVE',tgl:r.tgl,jam:r.jam,tarif:r.tarif||tarifLive(),
    peserta:[r.nama],mulai:r.mulai,selesai:r.selesai,marketplace:r.mp||'',
    status:'disetujui',sumber:'form-live',oleh:S.uid||'',ket:'Lembur LIVE'+(r.mp?' · '+r.mp:'')};
  var path='ot/'+S.pid+'/tim/LIVE';
  var cur=await getDoc(path,{entries:[]});
  var arr=cur.entries||[],i=-1;
  arr.forEach(function(x,k){if(x.id===rec.id)i=k;});
  if(i>=0) arr[i]=rec; else arr.push(rec);
  var ok=await setDoc(path,{entries:arr});
  if(ok&&!tanpaMuat) await reload();
  return ok;
}
async function hapusLive(id,diam){
  var path='ot/'+S.pid+'/tim/LIVE';
  var cur=await getDoc(path,{entries:[]});
  var arr=(cur.entries||[]).filter(function(x){return x.id!==id;});
  if(arr.length===((cur.entries||[]).length)) return true;
  var ok=await setDoc(path,{entries:arr});
  if(ok&&!diam){ await reload(); toast('Baris dihapus.','ok'); }
  else if(ok){ S.ot=S.ot.filter(function(x){return x.id!==id;}); }
  return ok;
}

async function simpanLembur(rec,timLama,hapusId){
  var tim=rec?rec.tim:timLama;
  async function tulis(t,mut){
    var path='ot/'+S.pid+'/tim/'+slug(t);
    var cur=await getDoc(path,{entries:[]});
    cur.entries=mut(cur.entries||[]);
    return setDoc(path,cur);
  }
  if(hapusId) await tulis(timLama,function(a){return a.filter(function(x){return x.id!==hapusId;});});
  else{
    if(timLama&&timLama!==tim) await tulis(timLama,function(a){return a.filter(function(x){return x.id!==rec.id;});});
    await tulis(tim,function(a){var i=-1;a.forEach(function(x,k){if(x.id===rec.id)i=k;});
      if(i>=0)a[i]=rec;else a.push(rec);return a;});
  }
  closeDrawer(); await reload();
  toast(hapusId?'Catatan lembur dihapus.':'Catatan lembur disimpan.','ok');
}

function buildReport(kind){
  var r=S.res,per=periodLabel(S.pid);
  var orang=Object.keys(r.perOrang).map(function(k){return r.perOrang[k];})
    .sort(function(a,b){return a.dept.localeCompare(b.dept)||a.nama.localeCompare(b.nama);});
  var wks=[];r.hari.forEach(function(h){var w=wkOf(h.tgl);if(wks.indexOf(w)<0)wks.push(w);});
  wks.sort(function(a,b){return a-b;});
  function sh(n,h,rows,uang){return {name:n,head:h,rows:rows,uang:uang||[]};}

  if(kind==='rekap'){
    var hdR=['Nama','Departemen','Jabatan','Hadir','Sakit','Izin','Alpha','Cuti','Dinas luar','Dibebaskan',
       'Hari telat','Potongan terlambat','Potongan tidak hadir','Total potongan'];
    var nAwal=hdR.length;
    var brR=orang.map(function(p){
        var byWk={};p.hari.forEach(function(h){var w=wkOf(h.tgl);
          byWk[w]=(byWk[w]||0)+h.potonganTelat+h.potonganHadir;});
        return [p.nama,p.dept,p.jabatan,p.hadir,p.sakit,p.izin,p.alpa,p.cuti,p.dinas,p.dibebaskan,p.hariTelat,
          p.potonganTelat,p.potonganHadir,p.totalPotongan]
          .concat(wks.map(function(w){return byWk[w]||0;}));});
    var totR=['TOTAL','',''];
    for(var ci=3;ci<nAwal+wks.length;ci++) totR.push(brR.reduce(function(a,b){return a+(+b[ci]||0);},0));
    return {title:'Rekap Potongan - '+per,sheets:[sh('Rekap Potongan',
      hdR.concat(wks.map(function(w){return 'WK-'+w;})), brR.concat([totR]),
      [11,12,13].concat(wks.map(function(w,i){return nAwal+i;})))]};
  }
  if(kind==='dept'){
    var d={};orang.forEach(function(p){
      var x=d[p.dept]||(d[p.dept]={orang:0,hadir:0,s:0,i:0,a:0,c:0,k:0,b:0,telat:0,pt:0,ph:0,lb:0,um:0,cek:0});
      x.orang++;x.hadir+=p.hadir;x.s+=p.sakit;x.i+=p.izin;x.a+=p.alpa;x.telat+=p.hariTelat;
      x.c+=p.cuti;x.k+=p.dinas;x.b+=p.dibebaskan;

async function unduh(filename,data){
  if(S.dl){
    try{await S.dl.save({filename:filename,data:data});toast('Berkas disimpan.','ok');}
    catch(e){if(e&&e.code==='declined')return;
      toast('Gagal menyimpan berkas: '+((e&&e.message)||'tidak diketahui'),'err');}
    return;
  }
  try{var b=(data instanceof Blob)?data:new Blob([data]);
    var u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1500);}
  catch(e){toast('Unduhan tidak tersedia di tampilan ini.','err');}
}

/* Pustaka Excel tidak menulis warna tab & warna sel, jadi disuntikkan langsung
   ke XML di dalam berkas .xlsx setelah dibuat. Kalau gagal, berkas polos tetap diunduh. */
function warnaiXlsx(buf,warnaTab,gaya){
  var z=XLSX.CFB.read(new Uint8Array(buf),{type:'array'});
  var dec=new TextDecoder(),enc=new TextEncoder();
  function idx(p){for(var i=0;i<z.FullPaths.length;i++) if(z.FullPaths[i].slice(-p.length)===p) return i; return -1;}
  function baca(p){var i=idx(p);return i<0?null:dec.decode(z.FileIndex[i].content);}
  function tulis(p,t){var i=idx(p);var b=enc.encode(t);z.FileIndex[i].content=b;z.FileIndex[i].size=b.length;}
  warnaTab.forEach(function(hex,k){
    var p='xl/worksheets/sheet'+(k+1)+'.xml',t=baca(p); if(!t||!hex) return;
    var tag='<tabColor rgb="FF'+hex+'"/>';
    if(/<sheetPr[^>]*\/>/.test(t)) t=t.replace(/<sheetPr([^>]*)\/>/,'<sheetPr$1>'+tag+'</sheetPr>');
    else if(/<sheetPr[^>]*>/.test(t)) t=t.replace(/<sheetPr([^>]*)>/,'<sheetPr$1>'+tag);
    else t=t.replace(/(<worksheet[^>]*>)/,'$1<sheetPr>'+tag+'</sheetPr>');
    tulis(p,t);});
  if(gaya){
    var st=baca('xl/styles.xml');
    var nFill=+((st.match(/<fills count="(\d+)"/)||[])[1]||0);
    var nFont=+((st.match(/<fonts count="(\d+)"/)||[])[1]||0);
    var nXf=+((st.match(/<cellXfs count="(\d+)"/)||[])[1]||0);
    var fills=gaya.isian.map(function(h){return '<fill><patternFill patternType="solid"><fgColor rgb="FF'+h+
      '"/><bgColor indexed="64"/></patternFill></fill>';}).join('');
    st=st.replace(/<fills count="\d+">([\s\S]*?)<\/fills>/,function(m,a){
      return '<fills count="'+(nFill+gaya.isian.length)+'">'+a+fills+'</fills>';});
    var fonts='<font><b/><sz val="14"/><name val="Calibri"/><family val="2"/></font>'+
              '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/><family val="2"/></font>'+
              '<font><b/><sz val="11"/><name val="Calibri"/><family val="2"/></font>';
    st=st.replace(/<fonts count="\d+">([\s\S]*?)<\/fonts>/,function(m,a){
      return '<fonts count="'+(nFont+3)+'">'+a+fonts+'</fonts>';});
    var xf=gaya.isian.map(function(h,i){return '<xf numFmtId="0" fontId="0" fillId="'+(nFill+i)+
      '" borderId="0" xfId="0" applyFill="1"/>';}).join('');
    xf+='<xf numFmtId="0" fontId="'+nFont+'" fillId="0" borderId="0" xfId="0" applyFont="1"/>';
    xf+='<xf numFmtId="0" fontId="'+(nFont+1)+'" fillId="'+(nFill+gaya.isian.indexOf(gaya.headerHex))+
        '" borderId="0" xfId="0" applyFont="1" applyFill="1"/>';
    xf+='<xf numFmtId="0" fontId="'+(nFont+2)+'" fillId="0" borderId="0" xfId="0" applyFont="1"/>';
    st=st.replace(/<cellXfs count="\d+">([\s\S]*?)<\/cellXfs>/,function(m,a){
      return '<cellXfs count="'+(nXf+gaya.isian.length+3)+'">'+a+xf+'</cellXfs>';});
    tulis('xl/styles.xml',st);
    var sJudul=nXf+gaya.isian.length,sHdr=sJudul+1,sTebal=sJudul+2;
    var sh=baca('xl/worksheets/sheet1.xml');
    gaya.sel.forEach(function(c){
      var sv=c.hex?(nXf+gaya.isian.indexOf(c.hex)):(c.judul?sJudul:(c.tebal?sTebal:sHdr));
      sh=sh.replace(new RegExp('<c r="'+c.ref+'"( s="\\d+")?'),'<c r="'+c.ref+'" s="'+sv+'"');});
    tulis('xl/worksheets/sheet1.xml',sh);
  }
  return XLSX.CFB.write(z,{fileType:'zip',type:'array'});
}
/* kolom yang isinya rupiah, dikenali dari judulnya */
var FMT_IDR='"Rp"\\ #,##0;[Red]-"Rp"\\ #,##0';
function kolomUang(sheet){
  if(sheet&&sheet.uang) return sheet.uang;      // ditandai eksplisit saat laporan dibuat
  var head=(sheet&&sheet.head)||sheet||[],out=[];
  head.forEach(function(h,i){
    var t=String(h);
    if(/jatah|jumlah|jam\b|orang|resi|status|nama|dept/i.test(t)) return;
    if(/potongan|upah|uang makan|^total\b|tarif|bersih|^wk-?\d/i.test(t)) out.push(i);});
  return out;
}
function exportExcelSederhana(kind){

  var ids=kind==='semua'?LAPORAN.map(function(l){return l.id;}):[kind];
  var reps=ids.map(function(id){var r0=buildReport(id);r0._id=id;return r0;});
  var wb=XLSX.utils.book_new(),used={},warnaTab=[],daftar=[],gaya=null;
  if(kind==='semua'){
    // lembar keterangan di paling depan; isinya dilengkapi setelah nama sheet final diketahui
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['']]),'Keterangan');
    used['Keterangan']=1; warnaTab.push(WARNA_LAPORAN.keterangan.hex);
  }

    var nm=s.name.slice(0,28),i=1; while(used[nm]){nm=s.name.slice(0,25)+' '+(++i);} used[nm]=1;
    var aoa=[[rep.title]];
    if(s.ket) aoa.push([s.ket]);
    aoa.push([]);
    if(s.head2) aoa.push(s.head2);
    aoa.push(s.head);
    var barisData=aoa.length;
    var ws=XLSX.utils.aoa_to_sheet(aoa.concat(s.rows));
    // angka rupiah dibulatkan dan diberi format mata uang IDR tanpa desimal
    var mc=kolomUang(s);
    mc.forEach(function(c){
      for(var rr=0;rr<s.rows.length;rr++){
        var v=s.rows[rr][c];
        if(typeof v!=='number'||!isFinite(v)) continue;
        var addr=XLSX.utils.encode_cell({r:barisData+rr,c:c});
        if(!ws[addr]) continue;
        ws[addr].t='n'; ws[addr].v=Math.round(v); ws[addr].z=FMT_IDR;
      }
    });
    ws['!cols']=s.head.map(function(h,i2){
      if(s.head2&&s.head2[i2]!==undefined&&i2>=(s.kolomTanggal||12)) return {wch:5};

      s.rows.forEach(function(r){var v=r[i2];

        w=Math.max(w,teks.length+2);});
      return {wch:Math.min(42,w)};});
    if(s.head2) ws['!freeze']={xSplit:2,ySplit:(s.ket?5:4)};
    XLSX.utils.book_append_sheet(wb,ws,nm);
    var wl=WARNA_LAPORAN[rep._id]||{hex:'',nama:''};
    warnaTab.push(wl.hex);
    var lap=LAPORAN.filter(function(l){return l.id===rep._id;})[0]||{nama:rep.title,ket:''};
    daftar.push({nm:nm,warna:wl,laporan:lap.nama,isi:s.ket?s.ket:lap.ket,baris:s.rows.length});});});
  if(kind==='semua'){
    var aoaK=[['Keterangan Laporan Absensi & Lembur'],
      ['Periode: '+periodLabel(S.pid)],
      ['Dibuat: '+tglID(hariIni())+' · HR Department'],[],

    daftar.forEach(function(x,i){aoaK.push([' ',x.warna.nama,i+1,x.nm,x.laporan,x.isi,x.baris]);});
    aoaK.push([]);
    aoaK.push(['Catatan']);
    aoaK.push(['','Semua nominal dalam Rupiah, dibulatkan tanpa desimal.']);
    aoaK.push(['','Laporan lembur hanya memuat lembur berstatus disetujui.']);
    aoaK.push(['','Kode kalender: \u221A hadir atau off · S sakit · I izin · A alpha · C cuti · K dinas luar · B dibebaskan HR · '+
      'TH telat lewat batas · V perlu diverifikasi · jj:mm menit telat yang dipotong.']);
    aoaK.push(['','Warna tab di bagian bawah Excel sama dengan kolom Warna di atas.']);
    var wsK=XLSX.utils.aoa_to_sheet(aoaK);
    wsK['!cols']=[{wch:8},{wch:13},{wch:5},{wch:22},{wch:34},{wch:80},{wch:12}];
    wb.Sheets['Keterangan']=wsK;
    var hdrRow=5,isian=[],sel=[{ref:'A1',judul:true}];
    ['A','B','C','D','E','F','G'].forEach(function(c){sel.push({ref:c+hdrRow});});
    daftar.forEach(function(x,i){
      if(isian.indexOf(x.warna.hex)<0) isian.push(x.warna.hex);
      sel.push({ref:'A'+(hdrRow+1+i),hex:x.warna.hex});});
    var hdrHex=WARNA_LAPORAN.kalender.hex; if(isian.indexOf(hdrHex)<0) isian.push(hdrHex);
    sel.push({ref:'A'+(hdrRow+daftar.length+2),tebal:true});
    gaya={isian:isian,headerHex:hdrHex,sel:sel};
  }
  var out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  try{ out=warnaiXlsx(out,warnaTab,gaya); }
  catch(err){ console.warn('warna sheet gagal, berkas tetap diunduh tanpa warna',err); }

  detail:  {hex:'5B6480',muda:'ECEEF4',nama:'Detail harian',ket:'Seluruh baris absensi beserta hasil hitungnya'},
  cek:     {hex:'6D4BD8',muda:'ECE6FD',nama:'Verifikasi',   ket:'Baris yang menunggu keputusan HR'}
};
var FMT_RP='"Rp" #,##0;[Red]-"Rp" #,##0;"-"';
var FMT_BULAT='#,##0;-#,##0;"-"';
function argb(h){return 'FF'+h;}
function isoKeTanggalExcel(v){
  if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  var p=v.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
}
function namaSheetUnik(nm,used){
  var n=String(nm).replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31),i=1;
  while(used[n.toLowerCase()]){n=String(nm).slice(0,27)+' ('+(++i)+')';}
  used[n.toLowerCase()]=1; return n;
}
var WARNA_KODE={S:'FBE3E1',I:'FBE3E1',A:'F5B7B1',TH:'F5B7B1',C:'E1EDF9',K:'ECE6FD',B:'DDF3EA',V:'D9CCFA'};

function tulisSheetBerformat(wb,rep,s,warna,used){
  var nama=namaSheetUnik(s.name,used);
  var kal=!!s.head2, ncol=s.head.length, uang=kolomUang(s), KT=s.kolomTanggal||12;
  var ws=wb.addWorksheet(nama,{properties:{tabColor:{argb:argb(warna.hex)}},
    views:[{state:'frozen',xSplit:kal?2:1,ySplit:kal?5:4,showGridLines:false}]});
  var tipis={style:'thin',color:{argb:'FFD9DEEA'}};
  var bingkai={top:tipis,left:tipis,bottom:tipis,right:tipis};

  // baris 1: judul, baris 2: keterangan
  ws.mergeCells(1,1,1,Math.max(ncol,2));
  var c1=ws.getCell(1,1); c1.value=rep.title+(rep.sheets.length>1?' · '+s.name:'');
  c1.font={bold:true,size:14,color:{argb:'FF101838'}};
  ws.getRow(1).height=24;
  ws.mergeCells(2,1,2,Math.max(ncol,2));
  var c2=ws.getCell(2,1);
  c2.value='demo · HR Department · dicetak '+tglID(hariIni())+(s.ket?' · '+s.ket:'');
  c2.font={size:9.5,color:{argb:'FF6A7596'}}; c2.alignment={wrapText:true,vertical:'top'};
  ws.getRow(2).height=s.ket?30:16;

  var rHead=4;
  if(kal){
    // baris 4: kelompok WK, digabung per blok
    rHead=5;
    var awal=-1;
    for(var i=0;i<=ncol;i++){
      var lab=i<ncol?s.head2[i]:'#';
      if(lab){
        if(awal>=0){ if(i-1>awal) ws.mergeCells(4,awal+1,4,i);
          var cw=ws.getCell(4,awal+1); cw.value=s.head2[awal];
          cw.font={bold:true,color:{argb:argb(warna.hex)}}; cw.alignment={horizontal:'center'};
          cw.fill={type:'pattern',pattern:'solid',fgColor:{argb:argb(warna.muda)}}; cw.border=bingkai; }
        awal=i<ncol?i:-1;
      }
    }
  }
  // judul kolom
  var hr=ws.getRow(rHead);
  s.head.forEach(function(h,i){var c=hr.getCell(i+1); c.value=h;
    c.font={bold:true,color:{argb:'FFFFFFFF'},size:10};
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:argb(warna.hex)}};
    c.alignment={horizontal:'center',vertical:'middle',wrapText:true}; c.border=bingkai;});
  hr.height=32;

  // data
  var nData=s.rows.length;
  var kolomBulat={};
  s.head.forEach(function(h,ci){
    if(uang.indexOf(ci)>=0||(kal&&ci>=KT)) return;
    var ada=false,semuaBulat=true;
    s.rows.forEach(function(row){var v=row[ci];
      if(typeof v==='string'&&/^-?\d+(\.\d+)?$/.test(v.trim())) v=+v;
      if(typeof v==='number'){ada=true;if(Math.round(v)!==v)semuaBulat=false;}});
    if(ada&&semuaBulat&&!/no id/i.test(h)) kolomBulat[ci]=1;
  });
  var kolomPanjang={};
  s.head.forEach(function(h,ci){if(/peserta|keterangan|catatan|masalah/i.test(h)) kolomPanjang[ci]=1;});
  s.rows.forEach(function(row,ri){
    var r=ws.getRow(rHead+1+ri);
    var total=String(row[0]).toUpperCase()==='TOTAL';
    row.forEach(function(v,ci){
      if(typeof v==='string'&&/^-?\d+(\.\d+)?$/.test(v.trim())&&!/no id|nama/i.test(s.head[ci])) v=+v;
      var c=r.getCell(ci+1),isUang=uang.indexOf(ci)>=0;
      if(isUang&&typeof v==='number'){c.value=Math.round(v);c.numFmt=FMT_RP;}
      else if(String(s.head[ci]).toLowerCase()==='tanggal'&&typeof v==='string'&&v){c.value=isoKeTanggalExcel(v);c.numFmt='dd mmm yyyy';}
      else {c.value=(v===''||v==null)?null:v; if(kolomBulat[ci]&&typeof v==='number'&&Math.round(v)===v) c.numFmt=FMT_BULAT;}
      c.border=bingkai;
      c.font={size:10,bold:total,color:{argb:'FF101838'}};
      if(kal&&ci>=KT){
        c.alignment={horizontal:'center',vertical:'middle'};
        var kode=String(v||''),w2=WARNA_KODE[kode]||(/^\d{2}:\d{2}$/.test(kode)?'FDF0D8':null);
        if(w2&&!total) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+w2}};
        if(kode==='A'||kode==='TH') c.font={size:10,bold:true,color:{argb:'FFC43B36'}};
      } else {
        c.alignment={vertical:'middle',horizontal:(typeof v==='number'||isUang)?'right':'left',wrapText:!!kolomPanjang[ci]};
      }
      if(total) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:argb(warna.muda)}};
      else if(ri%2===1&&!(kal&&ci>=KT&&c.fill)) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF7F8FC'}};
    });
    if(total){ row.forEach(function(v,ci){ var c=r.getCell(ci+1);
      c.border={top:{style:'medium',color:{argb:argb(warna.hex)}},bottom:tipis,left:tipis,right:tipis};}); }
  });

  // lebar kolom
  s.head.forEach(function(h,i){
    var col=ws.getColumn(i+1);
    if(kal&&i>=KT){col.width=6.5;return;}
    var w=Math.min(14,String(h).length+2);
    s.rows.forEach(function(row){var v=row[i];
      var t=(uang.indexOf(i)>=0&&typeof v==='number')?rp(v):
            (String(s.head[i]).toLowerCase()==='tanggal'?'00 Mmm 0000':String(v==null?'':v));
      w=Math.max(w,t.length+2);});
    col.width=Math.min(w,/peserta|keterangan|catatan|masalah/i.test(h)?60:30);
  });

  if(!kal&&nData) ws.autoFilter={from:{row:rHead,column:1},to:{row:rHead+nData,column:ncol}};
  ws.pageSetup={orientation:'landscape',paperSize:kal?8:9,fitToPage:true,fitToWidth:1,fitToHeight:0,
    margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.3,footer:0.3},
    printTitlesRow:(kal?4:rHead)+':'+rHead};
  ws.headerFooter={oddFooter:'&L'+nama+'&RHalaman &P dari &N'};
  return nama;
}

    k.alignment={wrapText:true,vertical:'middle'};
    [2,3,4].forEach(function(ci){ws.getCell(row,ci).border={bottom:{style:'thin',color:{argb:'FFD9DEEA'}}};});
    ws.getRow(row).height=20; row++;});
  row++;

  // kode kalender
  judul('Kode di sheet Kalender Kehadiran');

   ['S / I','Sakit / izin','FBE3E1'],['A','Alpha','F5B7B1'],['TH','Telat lewat batas, dihitung tidak hadir','F5B7B1'],

async function exportExcel(kind){
  if(typeof ExcelJS==='undefined'){ return exportExcelSederhana(kind); }
  var ids=kind==='semua'?LAPORAN.map(function(l){return l.id;}):[kind];
  var semua=kind==='semua';
  if(semua) loadingBuka('Menyusun Excel lengkap',['Menyusun sheet laporan','Merapikan format','Menyimpan berkas']);
  try{
    var wb=new ExcelJS.Workbook();
    wb.creator='HR Department'; wb.created=new Date();
    var daftar=[],used={keterangan:semua?1:0};
    if(semua){ used={keterangan:1}; }
    var reps=[];
    for(var i=0;i<ids.length;i++){
      if(semua) await loadingLangkah(0,(i+1)+' dari '+ids.length+' laporan',Math.round((i+1)/ids.length*60));
      reps.push({id:ids[i],rep:buildReport(ids[i])});
    }
    if(semua){ tulisSampul(wb,[],periodLabel(S.pid)); }
    if(semua) await loadingLangkah(1,'Warna, garis, lebar kolom, dan format rupiah',70);
    reps.forEach(function(x){
      var warna=WARNA_LAP[x.id]||WARNA_LAP.detail;
      x.rep.sheets.forEach(function(s){
        var nm=tulisSheetBerformat(wb,x.rep,s,warna,used);
        daftar.push({sheet:nm,warna:warna,sub:x.rep.sheets.length>1?s.name:''});});
    });
    if(semua){
      // tulis ulang sampul dengan daftar sheet yang sudah pasti namanya
      wb.removeWorksheet(wb.getWorksheet('Keterangan').id);
      tulisSampul(wb,daftar,periodLabel(S.pid));
      var sp=wb.getWorksheet('Keterangan'); sp.orderNo=0;
      wb.worksheets.sort(function(a,b){return (a.name==='Keterangan'?-1:b.name==='Keterangan'?1:0);});
      await loadingLangkah(2,'Menyimpan berkas',92);
    }
    var buf=await wb.xlsx.writeBuffer();
    if(semua) loadingTutup();
    unduh(fileBase(kind)+'.xlsx',new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  }catch(err){
    console.warn('ExcelJS gagal, pakai format sederhana',err);
    if(semua) loadingTutup();
    toast('Format rapi gagal dibuat di browser ini, diunduh dalam format sederhana.','err');
    exportExcelSederhana(kind);
  }
}

function exportPDF(kind){
  var J=window.jspdf&&window.jspdf.jsPDF;
  if(!J){toast('Modul PDF belum selesai dimuat. Coba lagi sebentar.','err');return;}
  var rep=buildReport(kind),r=S.res;
  var doc=new J({orientation:'landscape',unit:'pt',format:rep.lebar?'a3':'a4'});
  var W=doc.internal.pageSize.getWidth();
  var AT=(typeof doc.autoTable==='function')?function(o){return doc.autoTable(o);}
    :(window.jspdf&&typeof window.jspdf.autoTable==='function')?function(o){return window.jspdf.autoTable(doc,o);}
    :(typeof window.autoTable==='function')?function(o){return window.autoTable(doc,o);}:null;
  if(!AT){toast('Modul tabel PDF tidak tersedia. Gunakan Excel untuk sementara.','err');return;}
  function judul(t,sub){
    doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(16,24,56);doc.text(t,40,42);
    doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(106,117,150);
    doc.text('demo · dicetak '+new Date().toLocaleDateString('id-ID')+(sub?' · '+sub:''),40,57);
  }
  function tabel(s,y){
    var mc=kolomUang(s);
    AT({head:s.head2?[s.head2,s.head]:[s.head],body:s.rows.map(function(row){return row.map(function(c,i){
        return (mc.indexOf(i)>=0&&typeof c==='number')?(c?rp(c):'Rp 0'):(c==null?'':String(c));});}),
      startY:y||70,margin:{left:40,right:40,bottom:38},
      styles:{fontSize:rep.lebar?5.6:7.2,cellPadding:rep.lebar?1.6:3.2,lineColor:[221,227,241],lineWidth:.4,textColor:[24,32,64],overflow:'hidden'},
      headStyles:{fillColor:[20,33,90],textColor:255,fontSize:rep.lebar?5.6:7.2,fontStyle:'bold'},
      alternateRowStyles:{fillColor:[244,246,252]},
      columnStyles:mc.reduce(function(a,i){a[i]={halign:'right'};return a;},{}),
      didDrawPage:function(){doc.setFontSize(7.5);doc.setTextColor(150,156,178);
        doc.text('Halaman '+doc.internal.getNumberOfPages(),W-40,doc.internal.pageSize.getHeight()-20,{align:'right'});}});
  }
  if(kind==='slip'){
    var orang=Object.keys(r.perOrang).map(function(k){return r.perOrang[k];})
      .sort(function(a,b){return a.dept.localeCompare(b.dept)||a.nama.localeCompare(b.nama);});
    orang.forEach(function(p,idx){
      if(idx) doc.addPage();
      judul('Slip Potongan & Lembur - '+p.nama,p.dept+' · '+p.jabatan+' · '+periodLabel(S.pid));
      var l=p.lembur||{upah:0,uangMakan:0,total:0,jam:0,jatahMakan:0};
      AT({head:[['Ringkasan','Jumlah']],body:[
        ['Hari hadir',String(p.hadir)],['Sakit / Izin / Alpha',p.sakit+' / '+p.izin+' / '+p.alpa],
        ['Cuti / Dinas luar / Dibebaskan',p.cuti+' / '+p.dinas+' / '+p.dibebaskan],
        ['Hari kena potongan terlambat',String(p.hariTelat)],
        ['Potongan terlambat',rp(p.potonganTelat)],['Potongan tidak hadir',rp(p.potonganHadir)],
        ['Total potongan',rp(p.totalPotongan)],['Jam lembur',String(l.jam||0)],
        ['Upah lembur',rp(l.upah)],['Uang makan ('+(l.jatahMakan||0)+' jatah)',rp(l.uangMakan)],
        ['Selisih bersih',rp((l.total||0)-p.totalPotongan)]],
        startY:72,margin:{left:40,right:W/2+10},
        styles:{fontSize:8,cellPadding:4,lineColor:[221,227,241],lineWidth:.4},
        headStyles:{fillColor:[20,33,90],textColor:255,fontSize:8},
        columnStyles:{1:{halign:'right',fontStyle:'bold'}}});
      var kena=p.hari.filter(function(h){return h.potonganTelat||h.potonganHadir||h.status==='perludicek';});
      AT({head:[['Tanggal','Status','Telat','Keterangan','Potongan']],
        body:kena.length?kena.map(function(h){return [tglID(h.tgl,true),h.status,
          h.telatMenit?h.telatMenit+' m':'·',(h.ket||h.alasan||h.flag||'').slice(0,44),
          rp(h.potonganTelat+h.potonganHadir)];}):[['·','tidak ada potongan','','','Rp 0']],
        startY:72,margin:{left:W/2+10,right:40},
        styles:{fontSize:7.2,cellPadding:3.2,lineColor:[221,227,241],lineWidth:.4},
        headStyles:{fillColor:[20,33,90],textColor:255,fontSize:7.2},columnStyles:{4:{halign:'right'}}});
    });
  }else rep.sheets.forEach(function(s,i){if(i)doc.addPage();judul(rep.title,s.ket||s.name);tabel(s,72);});
  unduh(fileBase(kind)+'.pdf',doc.output('blob'));
}

function loadingBuka(judul,langkah){

      return '<div data-step="'+i+'"><b></b>'+esc(t)+'</div>';}).join('')+'</div></div>';
  document.body.appendChild(o);
}
async function loadingLangkah(i,sub,pct){
  var o=$('#loadOv'); if(!o) return;
  $$('[data-step]',o).forEach(function(d){var k=+d.dataset.step;
    d.className=k<i?'done':(k===i?'on':''); d.querySelector('b').textContent=k<i?'✓':'';});
  if(sub!=null) $('#loadS').textContent=sub;
  if(pct!=null) $('#loadBar').style.width=Math.max(0,Math.min(100,pct))+'%';
  await tunggu(30);   // beri waktu browser menggambar ulang sebelum kerja berat berikutnya
}

function cellStr(v){if(v==null)return'';if(v instanceof Date)return cellDate(v);return String(v).trim();}
function cellTime(v){
  if(v==null||v==='')return'';
  if(v instanceof Date)return String(v.getHours()).padStart(2,'0')+':'+String(v.getMinutes()).padStart(2,'0');
  if(typeof v==='number'){var m=Math.round((v%1)*1440);
    return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
  var s=String(v).trim(),mm=s.match(/^(\d{1,2}):(\d{2})/);
  return mm?String(+mm[1]).padStart(2,'0')+':'+mm[2]:'';
}
function cellDate(v){
  if(v==null||v==='') return '';
  // 1) angka serial Excel: paling akurat, dihitung penuh dalam UTC
  if(typeof v==='number'&&isFinite(v)&&v>20000&&v<80000){
    var d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);
    return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+
           String(d.getUTCDate()).padStart(2,'0');
  }
  // 2) objek Date: bulatkan ke tengah malam terdekat sebelum diambil tanggalnya,
  //    karena pembaca berkas kadang meleset beberapa detik ke hari sebelumnya
  if(v instanceof Date){
    var t=new Date(Math.round(v.getTime()/86400000)*86400000);
    var beda=Math.abs(v.getTime()-t.getTime());
    if(beda<=6*3600000){   // dekat tengah malam UTC: pakai UTC
      return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')+'-'+
             String(t.getUTCDate()).padStart(2,'0');
    }
    var L=new Date(v.getTime()); var menit=L.getHours()*60+L.getMinutes();
    if(menit>=1320) L=new Date(L.getTime()+(1440-menit+1)*60000);
    return L.getFullYear()+'-'+String(L.getMonth()+1).padStart(2,'0')+'-'+String(L.getDate()).padStart(2,'0');
  }
  var t2=String(v).trim();
  var m2=t2.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m2) return m2[1]+'-'+String(+m2[2]).padStart(2,'0')+'-'+String(+m2[3]).padStart(2,'0');
  m2=t2.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m2){
    var a=+m2[1],b=+m2[2],yy=+m2[3];
    if(yy<100) yy+=2000;
    var hh,bln;
    if(a>12){hh=a;bln=b;} else if(b>12){hh=b;bln=a;} else {hh=a;bln=b;}
    if(bln<1||bln>12||hh<1||hh>31) return '';
    return yy+'-'+String(bln).padStart(2,'0')+'-'+String(hh).padStart(2,'0');
  }
  return '';
}
