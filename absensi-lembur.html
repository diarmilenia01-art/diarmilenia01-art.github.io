async function simpanImpor(pid,start,end,norm,baru){
  setBusy(true);
  loadingBuka('Menyimpan ke periode '+pidLabel(pid));
  try{
    await loadingLangkah(2,'Menyiapkan…',45);
    if(baru.length){
      var n=S.employees.length;
      baru.forEach(function(nm){n++;
        S.employees.push({id:'E'+String(n).padStart(3,'0'),nama:nm,jabatan:'Staff',
          dept:(norm.filter(function(x){return x.nama===nm;})[0]||{}).dept||'-',alias:[],aktif:true});});
      await setDoc('config/employees',{list:S.employees});
    }
    // simpan No. Id dari mesin ke master karyawan
    var idMap={};norm.forEach(function(x){if(x.noid)idMap[x.nama.toUpperCase()]=x.noid;});
    var ubah=false;
    S.employees.forEach(function(e){
      var v=idMap[e.nama.toUpperCase()];
      if(!v)(e.alias||[]).forEach(function(a){v=v||idMap[String(a).toUpperCase()];});
      if(v&&e.noid!==v){e.noid=v;ubah=true;}});
    if(ubah) await setDoc('config/employees',{list:S.employees});
    var grup={};norm.forEach(function(x){
      var d=DEPTS.indexOf(x.dept)>=0?x.dept:'_lain';(grup[d]=grup[d]||[]).push(x);});
    var keys=Object.keys(grup),k=0;
    for(var d in grup){
      k++;
      await loadingLangkah(2,'Departemen '+(d==='_lain'?'lainnya':d)+' · '+k+' dari '+keys.length+
        ' ('+grup[d].length+' baris)',45+Math.round(k/keys.length*35));
      var path='att/'+pid+'/dept/'+(d==='_lain'?'_lain':slug(d));
      var cur=await getDoc(path,{rows:[]}),map={};
      (cur.rows||[]).forEach(function(r){map[r.n+'|'+r.t]=r;});
      grup[d].forEach(function(x){map[x.nama+'|'+x.tgl]=packRow(x);});
      if(!(await setDoc(path,{rows:Object.keys(map).map(function(q){return map[q];})})))
        throw new Error('Gagal menyimpan departemen '+d+'.');
    }
    var ex=S.periods.filter(function(p){return p.id===pid;})[0];
    if(!ex){ex={id:pid,start:start,end:end,rows:0,ot:0,kunci:false};S.periods.push(ex);}
    ex.start=ex.start&&ex.start<start?ex.start:start; ex.end=ex.end&&ex.end>end?ex.end:end;
    S.periods.sort(function(a,b){return a.id<b.id?-1:1;});
    await loadingLangkah(3,'Memuat ulang data periode…',85);
    S.pid=pid; await loadPeriod(S.pid);
    ex.rows=S.rows.length; ex.ot=S.ot.length;
    ex.label=pidLabel(pid)+' ('+tglID(ex.start,true)+' – '+tglID(ex.end,true)+')';
    await setDoc('config/periods',{list:S.periods});
    await loadingLangkah(3,'Menerapkan aturan potongan dan lembur…',94);
    compute();
    await loadingLangkah(4,'Selesai',100);
    await tunggu(350);
    loadingTutup(); S.tab='dash'; render();
    toast(norm.length.toLocaleString('id-ID')+' baris tersimpan ke periode '+pidLabel(pid)+'.','ok');
  }catch(e){
    console.error(e); loadingTutup();
    toast(e.message||'Impor gagal. Coba lagi.','err');
    var b=$('#btnSave'); if(b){b.disabled=false;b.textContent='Coba simpan lagi';}
  }finally{ setBusy(false); }
}

function kartuPeriode(){
  return '<div class="card"><div class="card-h"><h2>Kelola periode</h2>'+
    '<span class="sub">periode yang dilindungi tidak bisa dihapus</span></div>'+
    (S.periods.length? tbl(['Periode','Rentang tanggal',{n:'Baris absensi'},'Status',''],
      S.periods.map(function(p){var k=!!p.kunci;
        return ['<span class="nm">'+esc(p.label)+'</span>'+(p.id===S.pid?' <span class="pill info">sedang dibuka</span>':''),
          '<span class="dim">'+esc(tglID(p.start))+' s.d. '+esc(tglID(p.end))+'</span>',
          {n:(p.rows||0).toLocaleString('id-ID')},
          k?'<span class="pill ok">'+icon('lock')+'Dilindungi</span>':'<span class="pill warn">Bisa dihapus</span>',
          isHR()?'<div class="row" style="gap:6px;justify-content:flex-end">'+
            '<button class="btn sm" data-pk="'+p.id+'">'+(k?'Buka perlindungan':'Lindungi')+'</button>'+
            '<button class="btn sm danger" data-pdel="'+p.id+'"'+(k?' disabled title="Buka perlindungan dulu"':'')+'>Hapus</button></div>':''];}),
      {minw:680})
     :'<div class="empty">Belum ada periode.</div>')+
    '<p class="hint" style="margin:10px 0 0">Menghapus periode ikut menghapus seluruh baris absensi, catatan lembur, dan koreksi HR di periode itu. '+
      'Lindungi periode yang sudah final supaya tidak terhapus tanpa sengaja.</p>'+
  '</div>';
}
async function togglePeriode(pid){
  var p=S.periods.filter(function(x){return x.id===pid;})[0]; if(!p) return;
  p.kunci=!p.kunci;
  if(await setDoc('config/periods',{list:S.periods})){render();
    toast(p.kunci?'Periode '+pidLabel(pid)+' dilindungi.':'Perlindungan periode '+pidLabel(pid)+' dibuka.','ok');}
  else p.kunci=!p.kunci;
}
async function hapusPeriode(pid){
  var p=S.periods.filter(function(x){return x.id===pid;})[0]; if(!p) return;
  if(p.kunci){toast('Periode ini dilindungi. Buka perlindungannya dulu.','err');return;}
  var ada=[],nAtt=0,nOt=0,nOv=0,i,d;
  var paths=DEPTS.map(function(x){return 'att/'+pid+'/dept/'+slug(x);}).concat(['att/'+pid+'/dept/_lain']);
  for(i=0;i<paths.length;i++){d=await getDoc(paths[i],null);if(d){ada.push(paths[i]);nAtt+=(d.rows||[]).length;}}
  for(i=0;i<TIMS.length;i++){var tp='ot/'+pid+'/tim/'+slug(TIMS[i]);d=await getDoc(tp,null);
    if(d){ada.push(tp);nOt+=(d.entries||[]).length;}}
  d=await getDoc('ov/'+pid,null);
  if(d){ada.push('ov/'+pid);Object.keys(d.byEmp||{}).forEach(function(k){nOv+=Object.keys(d.byEmp[k]).length;});}
  drawer('Hapus periode '+p.label,'Tindakan ini permanen dan tidak bisa dibatalkan.',
    '<div class="notice bad">'+icon('warn')+'<div><b>Yang akan ikut terhapus:</b><br>'+
      nAtt.toLocaleString('id-ID')+' baris absensi · '+nOt+' catatan lembur · '+nOv+' koreksi HR</div></div>'+
    '<div class="field"><label>Ketik <b>HAPUS</b> untuk melanjutkan</label>'+
      '<input class="inp" id="konfHapus" autocomplete="off" placeholder="HAPUS"></div>',
    '<button class="btn" data-close>Batal</button>'+
    '<button class="btn danger" id="btnHapusFinal" disabled style="background:var(--bad);color:#fff;border-color:var(--bad)">Hapus permanen</button>',
    function(w){
      var inp=$('#konfHapus',w),b=$('#btnHapusFinal',w);
      setTimeout(function(){inp.focus();},30);
      inp.oninput=function(){b.disabled=inp.value.trim()!=='HAPUS';};
      b.onclick=async function(){
        closeDrawer();
        loadingBuka('Menghapus '+pidLabel(pid),['Menghapus data periode','Memperbarui daftar periode']);
        for(var k=0;k<ada.length;k++){
          await loadingLangkah(0,'Dokumen '+(k+1)+' dari '+ada.length,Math.round((k+1)/ada.length*80));
          if(!(await delDoc(ada[k]))){loadingTutup();
            toast('Gagal menghapus sebagian data. Periode tetap ada, coba lagi.','err');render();return;}
        }
        await loadingLangkah(1,'Memperbarui daftar periode',90);
        S.periods=S.periods.filter(function(x){return x.id!==pid;});
        await setDoc('config/periods',{list:S.periods});
        if(S.pid===pid) S.pid=S.periods.length?S.periods[S.periods.length-1].id:null;
        await loadPeriod(S.pid); compute(); await loadingLangkah(2,'Selesai',100);
        loadingTutup(); render(); toast('Periode '+pidLabel(pid)+' dihapus.','ok');
      };
    });
}

async function sha256(t){
  var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0');}).join('');
}

  document.getElementById('root').innerHTML=
  '<div style="min-height:82vh;display:grid;place-items:center">'+
    '<form class="card" id="formKunci" style="width:min(400px,100%);padding:28px;display:flex;flex-direction:column;gap:16px" autocomplete="off">'+
      '<div style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">'+
        '<div class="brand-mark" style="width:60px;height:60px;border-radius:18px">'+fpSvg(34)+'</div>'+
        '<div><h1 style="font-size:20px;font-weight:800">Absensi &amp; Lembur</h1>'+
          '<p class="muted" style="margin:4px 0 0;font-size:13px">HR Department · masukkan password untuk membuka</p></div>'+
      '</div>'+
      '<div class="field"><label for="pw">Password</label>'+
        '<div style="position:relative">'+
          '<input class="inp" type="password" id="pw" autocomplete="current-password" style="padding-right:44px" autofocus>'+
          '<button type="button" class="btn sm" id="pwLihat" aria-label="Tampilkan password" '+
            'style="position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent">'+icon('eye')+'</button>'+
        '</div>'+
        '<span class="hint" id="pwMsg" role="alert" style="min-height:17px"></span></div>'+
      '<button class="btn navy" type="submit" id="pwBtn" style="justify-content:center;padding:11px">'+icon('lock')+'Buka dashboard</button>'+
    '</form>'+
  '</div>';
  var pw=$('#pw'),msg=$('#pwMsg'),btn=$('#pwBtn');
  setTimeout(function(){pw.focus();},30);
  $('#pwLihat').onclick=function(){pw.type=pw.type==='password'?'text':'password';pw.focus();};
  $('#formKunci').onsubmit=async function(ev){
    ev.preventDefault();
    var now=Date.now();
    if(now<tahanSampai){msg.textContent='Terlalu banyak percobaan. Coba lagi dalam '+
      Math.ceil((tahanSampai-now)/1000)+' detik.';return;}
    if(!pw.value){msg.textContent='Password belum diisi.';return;}
    btn.disabled=true;
    var ok=false;
    try{ok=(await sha256(pw.value))===KUNCI_HASH;}
    catch(e){msg.textContent='Browser ini tidak mendukung pemeriksaan password. Coba browser lain.';btn.disabled=false;return;}
    if(ok){ gagal=0; pw.value=''; mulai(); return; }
    gagal++; btn.disabled=false; pw.select();
    msg.style.color='var(--bad)';
    if(gagal>=5){tahanSampai=Date.now()+30000;gagal=0;
      msg.textContent='Password salah 5 kali. Tunggu 30 detik sebelum mencoba lagi.';}
    else msg.textContent='Password salah. Sisa '+(5-gagal)+' percobaan sebelum dikunci sementara.';
  };
}
function kunciLagi(){
  hapusJejakLama();
  S.rows=[];S.ot=[];S.ov={};S.res=null;S.employees=[];S.periods=[];S.pid=null;
  layarKunci();
}

/* ========================= BOOT ========================= */
async function mulai(){
  document.getElementById('root').innerHTML='<div class="boot"><div class="spin"></div><div>Memuat data…</div></div>';
  if(!S.db&&!S.user){
    try{S.db=await claude.use('db');S.user=await claude.use('user');S.dl=await claude.use('downloads');}
    catch(e){console.warn(e);}
    if(S.user){
      try{var canEdit=await S.user.canEdit(),canData=await S.user.can('data.write');
        S.role=canEdit?'hr':(canData===false?'view':'leader');S.uid=await S.user.id();}
      catch(e){S.role='leader';}
    } else S.role='hr';
  }
  await loadConfig(); await loadPeriod(S.pid); compute(); render();
}
function boot(){ hapusJejakLama(); layarKunci(); }
/* Kembali ke halaman ini lewat tombol Back (cache browser) juga harus minta password lagi */
window.addEventListener('pageshow',function(ev){ if(ev.persisted) kunciLagi(); });
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
</script>
