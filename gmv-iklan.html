<style>

<div class="wrap" id="app"><p class="muted" style="padding:40px 0;display:flex;align-items:center;gap:10px"><span class="spin" style="border-color:rgba(79,70,229,.35);border-top-color:var(--indigo)"></span>Memuat database…</p></div>

<script>
/* ============================ Konstanta ============================ */
const STORE="Demo Store"; // ← nama toko = kunci database, jangan diubah setelah ada data
const MPS=["Shopee","TikTok","Tokopedia","Lazada"];
const MP_COLOR={Shopee:"#2563EB",TikTok:"#0EA5E9",Tokopedia:"#6366F1",Lazada:"#94A3B8"};
const MP_GROUPS=[
  {label:"Shopee",             short:"Shop",   color:MP_COLOR.Shopee, mps:["Shopee"]},
  {label:"TikTok + Tokopedia", short:"TT+Tok", color:MP_COLOR.TikTok, mps:["TikTok","Tokopedia"]},
  {label:"Lazada",             short:"Laza",   color:MP_COLOR.Lazada, mps:["Lazada"]}
];
const KEY="gmv-demo:v1", HKEY="gmv-demo-hist:v1", MEKEY="gmv-demo-me:v1", PKEY="gmv-demo-prod:v1";
// Iklan hanya ada di Shopee dan di TikTok+Tokopedia (satu akun iklan gabungan). Lazada tanpa iklan.
const AD_CHANNELS=[
  {k:"Shopee",           label:"Shopee",            mps:["Shopee"],              color:MP_COLOR.Shopee},
  {k:"TikTok+Tokopedia", label:"TikTok + Tokopedia",mps:["TikTok","Tokopedia"],  color:MP_COLOR.TikTok}
];
const AD_KEYS=AD_CHANNELS.map(c=>c.k);
const NO_AD_MPS=MPS.filter(m=>!AD_CHANNELS.some(c=>c.mps.includes(m)));
const DEFAULT_TARGET=0;
const STOK_KRITIS=10;

/* ============================ Util ============================ */
function parseNum(v){
  if(v==null) return 0;
  if(typeof v==="number") return v;
  let s=String(v).trim().replace(/%/g,"").replace(/\s/g,"").replace(/^Rp/i,"").replace(/[^\d.,-]/g,"");
  if(s===""||s==="-") return 0;
  const hasC=s.includes(","), hasD=s.includes(".");
  if(hasC&&hasD){
    // pemisah desimal = tanda yang muncul paling akhir
    if(s.lastIndexOf(",")>s.lastIndexOf(".")) s=s.replace(/\./g,"").replace(",",".");
    else s=s.replace(/,/g,"");
  }else if(hasC){
    s=/^-?\d{1,3}(,\d{3})+$/.test(s)?s.replace(/,/g,""):s.replace(",",".");
  }else if(hasD){
    if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  }
  const n=parseFloat(s); return isNaN(n)?0:n;
}
function parseRp(v){ const s=String(v==null?"":v).replace(/[^\d.,-]/g,""); return Math.round(parseNum(s)); }
function acosTxt(cost,rev){ return cost?(rev?pct(cost/rev):"∞"):"–"; }
function acosTone(cost,rev){ return cost?((rev&&cost/rev<=1)?"up":"down"):""; }
const rp=n=>"Rp"+Math.round(n||0).toLocaleString("id-ID");
function rpShort(n){n=n||0;const a=Math.abs(n);
  if(a>=1e9) return "Rp"+(n/1e9).toFixed(2)+" M";
  if(a>=1e6) return "Rp"+(n/1e6).toFixed(1)+" jt";
  if(a>=1e3) return "Rp"+(n/1e3).toFixed(0)+" rb";
  return rp(n);}
const pct=x=>isFinite(x)?(x*100).toFixed(1)+"%":"–";
const num=n=>Math.round(n||0).toLocaleString("id-ID");
const dim=p=>{const[y,m]=p.split("-").map(Number);return new Date(y,m,0).getDate();};
const emptyDay=()=>({gmv:0,pesanan:0,pengunjung:0,retQty:0,retVal:0,cancelQty:0,cancelVal:0});
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function mName(p){return new Date(p+"-01").toLocaleDateString("id-ID",{month:"long",year:"numeric"});}
function defaultMonth(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
// Minggu mengikuti kalender Senin–Minggu, dipotong di awal dan akhir bulan.
// Contoh September 2026 (tgl 1 jatuh hari Selasa): 1–6, 7–13, 14–20, 21–27, 28–30.
function weekRanges(pk){
  const [y,m]=pk.split("-").map(Number), D=new Date(y,m,0).getDate();
  const out=[]; let st=1;
  while(st<=D){
    const dow=new Date(y,m-1,st).getDay();   // 0 = Minggu, 1 = Senin
    const en=Math.min(st+(7-dow)%7,D);        // maju sampai hari Minggu
    out.push({st,en}); st=en+1;
  }
  return out;
}
function weekIndex(pk,d){ return weekRanges(pk).findIndex(r=>d>=r.st&&d<=r.en); }

/* ============================ Parser laporan harian ============================ */
function detectMarketplace(wb){
  if(wb.SheetNames.some(n=>/siap dikirim/i.test(n))) return "Shopee";
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false});
  const blob=rows.slice(0,16).flat().map(x=>String(x).toLowerCase()).join(" | ");
  if(blob.includes("total penjualan")&&blob.includes("dikembalikan")) return "Shopee";
  if(blob.includes("lazada")) return "Lazada";
  if(blob.includes("aov")||blob.includes("live kreator")||blob.includes("impresi produk")||blob.includes("gmv video")) return "TikTok";
  if(blob.includes("pendapatan bruto")) return "Tokopedia";
  return "Tokopedia";
}
function parseDate(s){
  s=String(s).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/)) return {y:+m[1],mo:+m[2],d:+m[3]};
  if(m=s.match(/^(\d{2})[\/-](\d{2})[\/-](\d{4})$/)) return {y:+m[3],mo:+m[2],d:+m[1]};
  return null;
}
function pkey(dt){return dt.y+"-"+String(dt.mo).padStart(2,"0");}
function parseWorkbook(wb,mp){
  const byMonth={};
  const put=(dt,o)=>{const k=pkey(dt);(byMonth[k]=byMonth[k]||{})[dt.d]=o;};
  if(mp==="Shopee"){
    const nm=wb.SheetNames.find(n=>/siap dikirim/i.test(n))||"Pesanan Siap Dikirim";
    const ws=wb.Sheets[nm];
    if(!ws) throw new Error("Sheet 'Pesanan Siap Dikirim' tidak ada di file ini. Pilih file laporan penjualan Shopee.");
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false});
    for(const r of rows){const dt=parseDate(r[0]);
      if(dt) put(dt,{gmv:parseNum(r[1]),pesanan:parseNum(r[2]),pengunjung:parseNum(r[5]),
        cancelQty:parseNum(r[7]),cancelVal:parseNum(r[8]),retQty:parseNum(r[9]),retVal:parseNum(r[10])});}
  }else{
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false});
    const hi=rows.findIndex(r=>String(r[0]).trim()==="Tanggal");
    if(hi<0) throw new Error("Baris header 'Tanggal' tidak ketemu. Pastikan ini laporan harian per tanggal.");
    const hdr=rows[hi].map(x=>String(x||"").toLowerCase().trim());
    const find=pred=>{for(let i=1;i<hdr.length;i++){if(pred(hdr[i]))return i;}return -1;};
    let gi=find(h=>h==="gmv"); if(gi<0) gi=find(h=>h==="pendapatan");
    const pi=find(h=>h==="pesanan"),
          ri=find(h=>h.includes("pengembalian")||h.includes("retur")),
          ci=find(h=>h.includes("pembatalan")),
          vi=find(h=>h==="pengunjung");
    for(let r=hi+1;r<rows.length;r++){const dt=parseDate(rows[r][0]);
      if(dt) put(dt,{gmv:gi>=0?parseNum(rows[r][gi]):0,pesanan:pi>=0?parseNum(rows[r][pi]):0,
        retVal:ri>=0?parseNum(rows[r][ri]):0,retQty:0,cancelVal:ci>=0?parseNum(rows[r][ci]):0,cancelQty:0,
        pengunjung:vi>=0?parseNum(rows[r][vi]):0});}
  }
  const total=Object.values(byMonth).reduce((a,o)=>a+Object.keys(o).length,0);
  if(!total) throw new Error("Tidak ada baris tanggal yang terbaca dari file ini.");
  return byMonth;
}

/* ============================ Parser laporan produk ============================ */
const PROD_FIELDS=[
  {k:"sku",  lab:"Kode / SKU produk", req:true,  kw:["sku","kode produk","kode variasi","product id","id produk","seller sku","kode"]},
  {k:"name", lab:"Nama produk",       req:true,  kw:["nama produk","product name","judul produk","nama barang","produk","nama"]},
  {k:"gmv",  lab:"GMV / penjualan",   req:true,  kw:["penjualan (","total penjualan","penjualan","gmv","omzet","pendapatan","sales","revenue"]},
  {k:"unit", lab:"Unit terjual",      req:false, kw:["produk terjual","item terjual","unit terjual","terjual","qty","kuantitas","jumlah terjual","units sold"]},
  {k:"peng", lab:"Pengunjung produk", req:false, kw:["pengunjung produk","pengunjung","dilihat","kunjungan","visitor","page view","impresi"]},
  {k:"ord",  lab:"Pesanan",           req:false, kw:["pesanan dibayar","pesanan","order","transaksi"]},
  {k:"price",lab:"Harga jual",        req:false, kw:["harga satuan","harga jual","harga","price"]},
  {k:"stok", lab:"Stok tersisa",      req:false, kw:["stok tersedia","sisa stok","stok","stock","inventory","persediaan"]}
];
const ADS_FIELDS=[
  {k:"date",lab:"Tanggal",          req:false, kw:["tanggal","date","waktu","hari"]},
  {k:"cost",lab:"Biaya iklan",      req:true,  kw:["biaya iklan","total biaya","biaya","pengeluaran","dana terpakai","cost","spend"]},
  {k:"rev", lab:"Omzet dari iklan", req:true,  kw:["penjualan dari iklan","omzet iklan","gmv iklan","penghasilan bruto","penghasilan","penjualan","omzet","gmv","revenue","pendapatan"]}
];
function sheetMatrix(wb,sheetName){
  const ws=wb.Sheets[sheetName];
  if(!ws) throw new Error("Sheet tidak terbaca.");
  return XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,defval:""});
}
// Tanggal bisa berupa teks, objek Date, atau angka serial Excel.
function toDate(v){
  if(v instanceof Date) return {y:v.getFullYear(),mo:v.getMonth()+1,d:v.getDate()};
  if(typeof v==="number"&&v>20000&&v<60000){
    const d=new Date(Math.round((v-25569)*86400000));
    return {y:d.getUTCFullYear(),mo:d.getUTCMonth()+1,d:d.getUTCDate()};}
  // Buang bagian jam bila ada: "2026-08-01 00:00:00" → "2026-08-01".
  return parseDate(String(v==null?"":v).trim().split(/[ T]/)[0]);
}
/* ---- Preset per marketplace: kolom dikenali dari nama header, bukan posisi ---- */
const lowRow=r=>(r||[]).map(x=>String(x==null?"":x).toLowerCase().trim());
const iExact=(h,s)=>h.findIndex(x=>x===s);
function iLike(h,s,n){let c=0;for(let i=0;i<h.length;i++){if(h[i].includes(s)){if(c===(n||0))return i;c++;}}return -1;}
const cell=(row,i)=>String((i>=0&&row[i]!=null)?row[i]:"").trim();
const isBlank=v=>!v||v==="-";

const PRESETS=[{
  id:"shopee-produk",
  mp:"Shopee",
  title:"Shopee · Performa Produk",
  pickSheet:names=>names.find(n=>/performa terbaik/i.test(n)),
  headerRow:rows=>rows.findIndex(r=>lowRow(r).includes("kode produk")),
  detect:h=>iExact(h,"kode produk")>=0&&iLike(h,"penjualan (pesanan siap dikirim)")>=0,
  levels:[{k:"induk",label:"Per produk induk - lengkap dengan pengunjung & konversi"},
          {k:"variasi",label:"Per variasi - rinci per warna/tipe, tanpa pengunjung"}],
  resolve:(h,rows,hi,level)=>{
    const iKode=iExact(h,"kode produk"), iProduk=iExact(h,"produk"),
      iVarId=iLike(h,"kode variasi",0), iVarSku=iLike(h,"kode variasi",1),
      iVarNama=iExact(h,"nama variasi"), iInduk=iExact(h,"sku induk"),
      iGmv=iLike(h,"penjualan (pesanan siap dikirim)"),
      iUnit=iExact(h,"produk (pesanan siap dikirim)"),
      iOrd=iExact(h,"pesanan siap dikirim"),
      iPeng=iExact(h,"pengunjung produk (kunjungan)");
    const isVar=row=>!isBlank(cell(row,iVarId));
    const indukSku=row=>{const s=cell(row,iInduk);return isBlank(s)?cell(row,iKode):s;};
    if(level==="variasi"){
      // Produk tanpa variasi tetap ikut, diambil dari baris induknya, supaya total tidak bocor.
      const punyaVar=new Set();
      for(let r=hi+1;r<rows.length;r++){const row=rows[r]||[];if(isVar(row))punyaVar.add(cell(row,iKode));}
      return {cols:{"Nama":iProduk,"GMV":iGmv,"Unit":iUnit,"Pesanan":iOrd},
        keep:row=>isVar(row)||!punyaVar.has(cell(row,iKode)),
        skuOf:row=>{if(!isVar(row))return indukSku(row);

function guessHeaderRow(rows,fields){
  const F=fields||PROD_FIELDS;
  const allKw=F.flatMap(f=>f.kw);
  let best=0,bestScore=-1;
  for(let i=0;i<Math.min(rows.length,20);i++){
    const cells=(rows[i]||[]).map(c=>String(c).toLowerCase().trim()).filter(Boolean);
    if(cells.length<2) continue;
    let score=cells.filter(c=>allKw.some(k=>c.includes(k))).length*2+Math.min(cells.length,12)*0.1;
    if(score>bestScore){bestScore=score;best=i;}
  }
  return best;
}
function guessMapping(hdr,fields){
  const F=fields||PROD_FIELDS;
  const low=hdr.map(h=>String(h).toLowerCase().trim());
  const used=new Set(), map={};
  for(const f of F){
    let found=-1;
    for(const k of f.kw){
      for(let i=0;i<low.length;i++){
        if(used.has(i)||!low[i]) continue;
        if(low[i]===k){found=i;break;}
      }
      if(found>=0) break;
      for(let i=0;i<low.length;i++){
        if(used.has(i)||!low[i]) continue;
        if(low[i].includes(k)){found=i;break;}
      }
      if(found>=0) break;
    }
    if(found>=0){map[f.k]=found;used.add(found);}
  }
  return map;
}
function buildProducts(rows,hi,map,opts){
  opts=opts||{};
  const out={};
  const g=(row,k)=>{const i=map[k];
    if(Array.isArray(i)) return i.reduce((a,x)=>a+(x>=0?parseNum(row[x]):0),0);
    return (i==null||i<0)?null:row[i];};
  for(let r=hi+1;r<rows.length;r++){
    const row=rows[r]||[];
    if(opts.keep&&!opts.keep(row)) continue;
    const sku=String((opts.skuOf?opts.skuOf(row):g(row,"sku"))||"").trim();
    const name=String((opts.nameOf?opts.nameOf(row):g(row,"name"))||"").trim();
    if(!sku&&!name) continue;
    const id=sku||name;
    if(/^(total|jumlah|grand total|-)$/i.test(id)) continue;
    const gmv=parseNum(g(row,"gmv")), unit=parseNum(g(row,"unit"));
    const rec={n:name||sku, g:gmv, u:unit,
      v:parseNum(g(row,"peng")), o:parseNum(g(row,"ord")),
      p:parseNum(g(row,"price"))||(unit?Math.round(gmv/unit):0),
      s:parseNum(g(row,"stok"))};
    if(!rec.g&&!rec.u&&!rec.v&&!rec.s) continue;
    const prev=out[id];
    out[id]=prev?{n:rec.n||prev.n,g:prev.g+rec.g,u:prev.u+rec.u,v:prev.v+rec.v,o:prev.o+rec.o,
      p:rec.p||prev.p,s:Math.max(prev.s,rec.s)}:rec;
  }
  return out;
}

function adsKeyOf(name){
  const n=String(name||"").trim();
  if(AD_KEYS.includes(n)) return n;
  const ch=AD_CHANNELS.find(c=>c.mps.includes(n));
  return ch?ch.k:null;
}
function addAds(dst,src){
  if(!src) return;
  dst.m.cost+=parseNum(src.m&&src.m.cost); dst.m.rev+=parseNum(src.m&&src.m.rev);
  for(const i of Object.keys(src.w||{})){
    const w=src.w[i]||{}; dst.w[i]=dst.w[i]||{cost:0,rev:0};
    dst.w[i].cost+=parseNum(w.cost); dst.w[i].rev+=parseNum(w.rev);
  }
  dst.d=dst.d||{};
  for(const day of Object.keys(src.d||{})){
    const x=src.d[day]||{}; dst.d[day]=dst.d[day]||{cost:0,rev:0};
    dst.d[day].cost+=parseNum(x.cost); dst.d[day].rev+=parseNum(x.rev);
  }
}
function normPeriod(p){
  const o={data:emptyData(),target:0,ads:emptyAds()};
  let src=(p&&p.data)?p.data:{};
  // migrasi skema lama (data bertingkat per toko): { "<nama toko>": { Shopee:{...} } }
  if(src[STORE]&&typeof src[STORE]==="object"&&MPS.some(m=>src[STORE][m])) src=src[STORE];
  for(const m of MPS) if(src[m]) o.data[m]=clone(src[m]);
  o.target = (typeof p?.target==="number") ? p.target
           : (p&&p.targets&&p.targets[STORE]!=null) ? parseNum(p.targets[STORE])
           : parseNum(p&&p.target);
  if(p&&p.ads) for(const name of Object.keys(p.ads)){
    const k=adsKeyOf(name); if(!k) continue;
    addAds(o.ads[k],p.ads[name]);
  }
  return o;
}
function migrate(x){
  if(!x||!x.periods) return null;
  const out={active:x.active||defaultMonth(),periods:{}};
  for(const k of Object.keys(x.periods)) out.periods[k]=normPeriod(x.periods[k]);
  if(!out.periods[out.active]) out.active=Object.keys(out.periods).sort().slice(-1)[0]||defaultMonth();

  return out;
}

      const periods={};
      await Promise.all(keys.map(async k=>{
        try{ const s=await DBCAP.doc("periods/"+k).get();
          if(s.exists) periods[k]=normPeriod(clone(s.data()||{})); }catch(e){}
      }));
      if(!Object.keys(periods).length) return null;
      return {active:md.active||Object.keys(periods).sort().slice(-1)[0],periods};

}

  else { const all=localGet(PKEY)||{}; all[pk]=PROD[pk]||{}; localSet(PKEY,all); }
}
async function persist(){ if(DBCAP){ await saveMeta(); await savePeriod(DB.active); } else { localSet(KEY,DB); } }
async function persistAll(){ if(DBCAP){ await saveMeta(); for(const k of Object.keys(DB.periods)) await savePeriod(k); } else { localSet(KEY,DB); } }

async function loadHist(){
  if(DBCAP){ try{ const s=await DBCAP.doc("meta/history").get(); const d=s.exists?s.data():null;
    return (d&&Array.isArray(d.entries))?clone(d.entries):[]; }catch(e){ return []; } }
  return localGet(HKEY)||[];
}
function saveHist(){ if(DBCAP){ DBCAP.doc("meta/history").set({entries:HIST}).catch(()=>{}); } else { localSet(HKEY,HIST); } }
function logAct(action){ HIST.unshift({ts:Date.now(),who:(ME||"-"),action}); HIST=HIST.slice(0,200); saveHist(); }
function setMe(v){ ME=v; try{ localStorage.setItem(MEKEY,v);}catch(e){} }

function cur(){ return DB.periods[DB.active]; }
function ensurePeriod(p){ if(!DB.periods[p]) DB.periods[p]={data:emptyData(),target:lastTarget(),ads:emptyAds()}; return DB.periods[p]; }
function lastTarget(){ const ks=Object.keys(DB.periods).sort(); return ks.length?(DB.periods[ks[ks.length-1]].target||0):DEFAULT_TARGET; }

async function commit(msg){
  render(); busy("Menyimpan…");
  try{ await persist(); if(msg) toast(msg); }
  catch(e){ localSet(KEY,DB); toast("Gagal simpan ke database ("+((e&&e.code)||(e&&e.message)||"error")+"). Tersimpan sementara di peramban ini - klik Refresh lalu coba lagi."); }
  finally{ idle(); }
}
async function commitAll(msg){
  render(); busy("Menyimpan…");
  try{ await persistAll(); if(msg) toast(msg); }
  catch(e){ localSet(KEY,DB); toast("Gagal simpan ke database. Tersimpan sementara di peramban ini - klik Refresh lalu coba lagi."); }
  finally{ idle(); }
}
async function refreshAll(){
  busy("Memuat data terbaru…");
  try{
    const db=await loadDb(); const mg=db&&migrate(db);
    if(mg){ const keep=DB.active; DB=mg; if(DB.periods[keep]) DB.active=keep; }
    PROD={}; await loadProdMonth(DB.active);
    HIST=await loadHist();
    render(); toast("Data terbaru dimuat");
  }finally{ idle(); }
}

/* ============================ Iklan ============================ */
function adsOf(k){ const a=cur().ads||{}; return a[k]||{m:{cost:0,rev:0},w:{},d:{}}; }
function adsWeekSum(k,key){ const a=adsOf(k); return Object.values(a.w||{}).reduce((s,w)=>s+parseNum(w&&w[key]),0); }
// Input harian (per tanggal). Kalau ada, ringkasan minggu & bulan dihitung dari sini.
function adsDaily(k){ return adsOf(k).d||{}; }
function adsHasDaily(k){ const d=adsDaily(k); return Object.keys(d).some(day=>{const x=d[day]||{};return parseNum(x.cost)||parseNum(x.rev);}); }
function adsDaySum(k,st,en){ const d=adsDaily(k); let cost=0,rev=0; for(let day=st;day<=en;day++){const x=d[day]||{};cost+=parseNum(x.cost);rev+=parseNum(x.rev);} return {cost,rev}; }
function adsMonth(k){
  if(adsHasDaily(k)){ const s=adsDaySum(k,1,dim(DB.active)); return {cost:s.cost,rev:s.rev,src:"harian"}; }
  const a=adsOf(k), mc=parseNum(a.m&&a.m.cost), mr=parseNum(a.m&&a.m.rev);
  const wc=adsWeekSum(k,"cost"), wr=adsWeekSum(k,"rev");
  const useM=(mc||mr)>0;
  return {cost:useM?mc:wc, rev:useM?mr:wr, src:useM?"bulanan":(wc||wr?"mingguan":"kosong")};
}
function adsWeek(k,i){
  if(adsHasDaily(k)){ const r=weekRanges(DB.active)[i]; if(r){ const s=adsDaySum(k,r.st,r.en); return {cost:s.cost,rev:s.rev}; } }
  const w=(adsOf(k).w||{})[i]||{}; return {cost:parseNum(w.cost),rev:parseNum(w.rev)};
}
// Channel iklan yang relevan dengan marketplace yang sedang dipilih.
function adsChannels(mps){ return AD_CHANNELS.filter(c=>c.mps.some(m=>(mps||MPS).includes(m))); }
function adsMonthTotal(mps){ return adsChannels(mps).reduce((a,c)=>{const x=adsMonth(c.k);return{cost:a.cost+x.cost,rev:a.rev+x.rev};},{cost:0,rev:0}); }
function adsWeekTotal(mps,i){ return adsChannels(mps).reduce((a,c)=>{const x=adsWeek(c.k,i);return{cost:a.cost+x.cost,rev:a.rev+x.rev};},{cost:0,rev:0}); }
function setAds(k,scope,key,val){
  const p=cur(); p.ads=p.ads||emptyAds(); p.ads[k]=p.ads[k]||{m:{cost:0,rev:0},w:{},d:{}};
  if(scope==="m"){ p.ads[k].m=Object.assign({cost:0,rev:0},p.ads[k].m,{[key]:val}); }
  else { p.ads[k].w=p.ads[k].w||{}; p.ads[k].w[scope]=Object.assign({cost:0,rev:0},p.ads[k].w[scope],{[key]:val}); }
}
function setAdsDay(k,day,key,val){
  const p=cur(); p.ads=p.ads||emptyAds(); p.ads[k]=p.ads[k]||{m:{cost:0,rev:0},w:{},d:{}};
  p.ads[k].d=p.ads[k].d||{}; p.ads[k].d[day]=Object.assign({cost:0,rev:0},p.ads[k].d[day],{[key]:val});
}

/* ============================ Agregasi ============================ */
function mpsSel(){ return MP_SEL==="Semua"?MPS:(MP_GROUPS.find(g=>g.label===MP_SEL)||{mps:MPS}).mps; }
function aggregate(){
  const D=dim(DB.active), CD=cur().data, mps=mpsSel();
  const get=(m,d)=>(CD[m]&&CD[m][d])||{};
  const daily=[];
  for(let d=1;d<=D;d++){
    let gmv=0,red=0,pes=0,redq=0,peng=0;const perMp={};
    for(const m of MPS){const x=get(m,d);
      const net=(x.gmv||0)-(x.retVal||0)-(x.cancelVal||0);
      perMp[m]=net;
      if(mps.includes(m)){gmv+=x.gmv||0;red+=(x.retVal||0)+(x.cancelVal||0);
        pes+=x.pesanan||0;redq+=(x.retQty||0)+(x.cancelQty||0);peng+=x.pengunjung||0;}}
    daily.push(Object.assign({day:d,net:gmv-red,pes:pes-redq,peng},perMp));
  }
  const sum=k=>daily.reduce((a,r)=>a+r[k],0);
  const target=cur().target||0;
  const netGmv=sum("net"),netPes=sum("pes"),peng=sum("peng");
  const ads=adsMonthTotal(mps);
  let cum=0;const chart=daily.map(r=>{cum+=r.net;return Object.assign({},r,{cum,tgtCum:(target/D)*r.day});});
  const byMp=MPS.map(m=>{let real=0;for(let d=1;d<=D;d++){const x=get(m,d);real+=(x.gmv||0)-(x.retVal||0)-(x.cancelVal||0);}
    return{mp:m,real};});
  const realOf=mm=>byMp.filter(x=>mm.includes(x.mp)).reduce((s,x)=>s+x.real,0);
  const byCh=adsChannels(mps).map(c=>{const a=adsMonth(c.k), real=realOf(c.mps);
    return{k:c.k,label:c.label,color:c.color,real,cost:a.cost,rev:a.rev,src:a.src,
      roas:a.cost?a.rev/a.cost:0,gmvAdsPct:real?a.rev/real:0};});
  const weeks=weekRanges(DB.active).map((r,i)=>{
    const sl=daily.filter(x=>x.day>=r.st&&x.day<=r.en);
    const perMp={};MPS.forEach(m=>perMp[m]=sl.reduce((a,x)=>a+x[m],0));
    const ws=k=>sl.reduce((a,x)=>a+x[k],0);
    const wa=adsWeekTotal(mps,i);
    return Object.assign({i,label:r.st+"–"+r.en,st:r.st,en:r.en,net:ws("net"),pes:ws("pes"),peng:ws("peng"),
      cost:wa.cost,rev:wa.rev,tgt:(target/D)*(r.en-r.st+1)},perMp);});
  return{D,target,netGmv,netPes,peng,cost:ads.cost,rev:ads.rev,
    aov:netPes?netGmv/netPes:0,konv:peng?netPes/peng:0,roas:ads.cost?ads.rev/ads.cost:0,
    gmvAdsPct:netGmv?ads.rev/netGmv:0,pencapaian:target?netGmv/target:0,chart,byMp,byCh,weeks};
}
// Minggu yang sedang ditampilkan di tab Produk (PWEEK null → otomatis pilih minggu terakhir yang ada datanya).
function prodWeekIdx(){
  const wks=weekRanges(DB.active);
  let wi=PWEEK;
  if(wi==null||wi<0||wi>=wks.length){
    const src=PROD[DB.active]||{}; let last=-1;
    for(const m of MPS){ const byW=src[m]||{}; for(const k of Object.keys(byW)){ const i=+k;
      if(!isNaN(i)&&byW[k]&&Object.keys(byW[k]).length) last=Math.max(last,i); } }
    if(last>=0){ wi=last; }
    else { const now=new Date(), yy=+DB.active.split("-")[0], mm=+DB.active.split("-")[1];
      wi=(now.getFullYear()===yy&&now.getMonth()+1===mm)?wks.findIndex(r=>now.getDate()>=r.st&&now.getDate()<=r.en):0;
      if(wi<0) wi=0; }
  }
  return wi;
}
// wi = indeks minggu; kalau tidak diberikan, jumlahkan SEMUA minggu (dipakai ringkasan bulanan).
function prodRows(wi){
  const src=PROD[DB.active]||{}, mps=mpsSel(), agg={};
  for(const m of mps){
    const byW=src[m]||{};
    const weeks=(wi==null)?Object.keys(byW):[String(wi)];
    for(const wk of weeks){
      const items=byW[wk]||{};
      for(const sku of Object.keys(items)){
        const x=items[sku]||{}, id=m+"|"+sku, prev=agg[id];
        if(prev){ prev.g+=x.g||0; prev.u+=x.u||0; prev.v+=x.v||0; prev.o+=x.o||0;
          prev.s=Math.max(prev.s,x.s||0); if(x.p) prev.p=x.p; if(x.n) prev.n=x.n; }
        else agg[id]={sku,mp:m,n:x.n||sku,g:x.g||0,u:x.u||0,v:x.v||0,o:x.o||0,s:x.s||0,p:x.p||0};
      }
    }
  }
  return Object.values(agg).map(r=>Object.assign(r,{p:r.p||(r.u?r.g/r.u:0),k:r.v?((r.o||r.u)/r.v):0}));
}
function prodAgg(rows){
  const g=rows.reduce((a,r)=>a+r.g,0), u=rows.reduce((a,r)=>a+r.u,0);
  const v=rows.reduce((a,r)=>a+r.v,0), o=rows.reduce((a,r)=>a+(r.o||r.u),0);
  const sorted=rows.slice().sort((a,b)=>b.g-a.g);
  let c=0,n80=0; for(const r of sorted){c+=r.g;n80++;if(g&&c/g>=0.8)break;}
  const kritis=rows.filter(r=>r.s>0&&r.s<=STOK_KRITIS).length;
  const habis=rows.filter(r=>r.s===0&&r.u>0).length;
  return {gmv:g,unit:u,peng:v,ord:o,sku:rows.length,aov:u?g/u:0,konv:v?o/v:0,n80,kritis,habis,sorted};
}

/* ============================ Chart ============================ */
function chartSVG(data){
  const W=720,H=280,pL=46,pR=48,pT=12,pB=26,pw=W-pL-pR,ph=H-pT-pB;
  const netMax=Math.max(1,...data.map(d=>d.net))*1.15;
  const rMax=Math.max(1,...data.map(d=>Math.max(d.cum,d.tgtCum)))*1.05;
  const n=data.length, bw=(pw/n)*0.6;
  const x=d=>pL+((d-0.5)/n)*pw;
  let g="";
  for(let i=0;i<=4;i++){const y=pT+ph-(i/4)*ph;
    g+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="#eef1f5"/>`;
    g+=`<text x="${pL-6}" y="${y+3}" text-anchor="end" font-size="10" fill="#94a3b8">${(netMax*i/4/1e6).toFixed(0)} jt</text>`;
    g+=`<text x="${W-pR+6}" y="${y+3}" font-size="10" fill="#94a3b8">${(rMax*i/4/1e6).toFixed(0)} jt</text>`;}
  let bars="";
  for(const d of data){const h=(d.net/netMax)*ph;
    bars+=`<rect x="${x(d.day)-bw/2}" y="${pT+ph-h}" width="${bw}" height="${Math.max(0,h)}" rx="2" fill="#BFD4FE"><title>Tgl ${d.day} · ${rp(d.net)}</title></rect>`;}
  const line=(key,color,dash)=>{const pts=data.map(d=>`${x(d.day).toFixed(1)},${(pT+ph-(d[key]/rMax)*ph).toFixed(1)}`).join(" ");
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" ${dash?'stroke-dasharray="5 4"':""}/>`;}
  let xl="";const ticks=[1,5,10,15,20,25,n].filter((v,i,a)=>a.indexOf(v)===i&&v<=n);
  for(const t of ticks) xl+=`<text x="${x(t)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#94a3b8">${t}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="GMV bersih harian dan akumulasi terhadap target">
    ${g}${bars}${line("tgtCum","#f43f5e",true)}${line("cum","#2563EB",false)}${xl}</svg>`;
}

/* ============================ Render ============================ */
function kpi(lab,val,vsub,tone){return `<div class="card kpi"><div class="lab">${lab}</div>
  <div class="val ${tone||""}">${val}</div>${vsub?`<div class="vsub">${vsub}</div>`:""}</div>`;}
function deltaTxt(c,p){
  if(p===null||p===undefined||p===0) return `<span class="muted">- vs minggu lalu</span>`;
  const ch=(c-p)/p, cls=ch>=0?"up":"down", s=ch>=0?"▲":"▼";
  return `<span class="${cls}">${s} ${(Math.abs(ch)*100).toFixed(1)}% vs minggu lalu</span>`;}
function deltaShort(c,p){
  if(p===null||p===undefined||p===0) return `<span class="muted">-</span>`;
  const ch=(c-p)/p, cls=ch>=0?"up":"down", s=ch>=0?"▲":"▼";
  return `<span class="${cls}">${s} ${(Math.abs(ch)*100).toFixed(1)}%</span>`;}

function viewMinggu(a){
  const wk=a.weeks;
  let wi=WEEK_IDX; if(wi==null||wi>=wk.length) wi=wk.reduce((acc,w,i)=>(w.net||w.pes)?i:acc,0);
  const w=wk[wi]||{net:0,pes:0,peng:0,cost:0,rev:0}, prev=wi>0?wk[wi-1]:null;
  const aov=w.pes?w.net/w.pes:0, konv=w.peng?w.pes/w.peng:0;
  const paov=prev&&prev.pes?prev.net/prev.pes:null, pkonv=prev&&prev.peng?prev.pes/prev.peng:null;
  const roas=w.cost?w.rev/w.cost:0;
  const wkOpts=wk.map((x,i)=>`<option value="${i}" ${i===wi?"selected":""}>Minggu ${i+1} (tgl ${x.label})</option>`).join("");
  const grpVal=(row,g)=>g.mps.reduce((s,m)=>s+(row[m]||0),0);
  const totW=MP_GROUPS.reduce((s,g)=>s+grpVal(w,g),0)||1;

  const mpRows=MP_GROUPS.map(g=>{
    const cv=grpVal(w,g), pv=prev?grpVal(prev,g):null;
    const ch=AD_CHANNELS.find(c=>c.mps.join()===g.mps.join());
    const ca=ch?adsWeek(ch.k,wi):null;
    const r=ca&&ca.cost?ca.rev/ca.cost:0;
    const adsCells=ch
      ? `<td>${rpShort(ca.cost)}</td>
         <td class="${ca.cost?(r>=1?"up":"down"):""}" style="font-weight:600">${ca.cost?r.toFixed(2)+"×":"–"}</td>
         <td class="${acosTone(ca.cost,ca.rev)}" style="font-weight:600">${acosTxt(ca.cost,ca.rev)}</td>`
      : `<td class="muted" colspan="3" style="text-align:center">tanpa iklan</td>`;
    return `<tr>
      <td class="l"><span class="swatch" style="background:${g.color};margin-right:6px"></span>${g.label}</td>
      <td>${rpShort(cv)}</td><td>${pct(cv/totW)}</td><td style="font-weight:600">${deltaShort(cv,pv)}</td>
      ${adsCells}</tr>`;}).join("");
  const allRows=wk.map((x,i)=>{const p=x.tgt?x.net/x.tgt:0;
    return `<tr class="${i===wi?"selrow":""}"><td class="l muted">${x.label}</td>${MP_GROUPS.map(g=>`<td>${rpShort(grpVal(x,g))}</td>`).join("")}
      <td class="tot">${rpShort(x.net)}</td><td class="${p>=1?"up":"down"}" style="font-weight:600">${x.tgt?pct(p):"-"}</td></tr>`;}).join("");
  const adsNote=w.cost||w.rev?"":`<p class="mini" style="margin:8px 0 0">Iklan minggu ini belum diisi - buka Isi iklan, tab Harian.</p>`;
  return `
    <div class="row" style="margin-top:14px;align-items:center;gap:8px">
      <span class="muted" style="font-size:13px">Minggu:</span>
      <select id="weekSel" style="width:auto;font-weight:600">${wkOpts}</select>
      <span class="muted" style="font-size:12px">dibandingkan minggu sebelumnya</span>
    </div>
    <div class="grid k4" style="margin-top:12px">
      ${kpi("Realisasi GMV",rpShort(w.net),deltaTxt(w.net,prev?prev.net:null))}
      ${kpi("Pesanan bersih",num(w.pes),deltaTxt(w.pes,prev?prev.pes:null))}
      ${kpi("AOV",rpShort(aov),deltaTxt(aov,paov))}
      ${kpi("Konversi",pct(konv),deltaTxt(konv,pkonv))}
    </div>
    <div class="grid k4" style="margin-top:12px">
      ${kpi("Pengunjung",num(w.peng),deltaTxt(w.peng,prev?prev.peng:null))}
      ${kpi("Biaya iklan",rpShort(w.cost),deltaTxt(w.cost,prev?prev.cost:null))}
      ${kpi("Omzet iklan",rpShort(w.rev),deltaTxt(w.rev,prev?prev.rev:null))}
      ${kpi("ROAS",w.cost?roas.toFixed(2)+"×":"–","ACOS "+acosTxt(w.cost,w.rev),acosTone(w.cost,w.rev))}
    </div>
    <div class="card" style="margin-top:14px">
      <p class="sec-title">Per marketplace - minggu ${wi+1} (tgl ${w.label})</p>
      <div style="overflow-x:auto"><table>
        <thead><tr><th class="l">Marketplace</th><th>GMV bersih</th><th>Porsi</th><th>Δ minggu lalu</th><th>Biaya iklan</th><th>ROAS</th><th>ACOS</th></tr></thead>
        <tbody>${mpRows}</tbody></table></div>${adsNote}
    </div>
    <div class="card" style="margin-top:14px">
      <p class="sec-title">Semua minggu di ${mName(DB.active)}</p>
      <table><thead><tr><th class="l">Tgl</th>${MP_GROUPS.map(g=>`<th>${g.short}</th>`).join("")}<th>Total</th><th>Capai target</th></tr></thead>

  const perMp=MPS.map(m=>{const sub=rows.filter(r=>r.mp===m);

      ${kpi("Konversi produk",pct(pa.konv),num(pa.peng)+" pengunjung produk")}
      ${hasStok
        ? kpi("Stok perlu dicek",num(pa.kritis+pa.habis),pa.habis+" habis · "+pa.kritis+" ≤ "+STOK_KRITIS+" pcs",(pa.kritis+pa.habis)?"warn":"")
        : kpi("SKU tanpa penjualan",num(rows.filter(r=>!r.u).length),"dari "+num(pa.sku)+" SKU · file tanpa data stok")}

    <div class="two" style="margin-top:14px">
      <div class="card"><p class="sec-title">Sepuluh produk penyumbang GMV terbesar</p>${bars}

        <tbody>${perMp}</tbody></table></div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px">
        <p class="sec-title" style="margin:0">Semua produk · Minggu ${wi+1} · ${mName(DB.active)}</p>

/* ---- Unggah laporan harian ---- */
let PENDING=null;
function renderUpload(){
  document.getElementById("pbody").innerHTML=`
    <p class="muted" style="margin-top:0">Pilih file <code>.xlsx</code> hasil export laporan penjualan. Marketplace dikenali otomatis dari isi file; file Shopee dibaca dari sheet <b>Pesanan Siap Dikirim</b>. File yang memuat beberapa bulan dipisah sendiri per bulan.</p>
    <label class="drop"><span class="big">Pilih file export</span><span class="sm">Shopee · TikTok · Tokopedia · Lazada</span>
      <input id="fileIn" type="file" accept=".xlsx,.xls" style="display:none"></label>
    <div id="upErr"></div><div id="upConfirm"></div>
    <div class="reset">
      <button class="btn-ghost" id="clearBtn" style="color:#D0011B;border-color:#fecdd3">Kosongkan penjualan ${mName(DB.active)}</button>
    </div>`;
  document.getElementById("fileIn").onchange=e=>{if(e.target.files[0])handleFile(e.target.files[0]);};
  document.getElementById("clearBtn").onclick=()=>{cur().data=emptyData();
    logAct("kosongkan penjualan "+mName(DB.active));commit("Penjualan "+mName(DB.active)+" dikosongkan");};
}
async function handleFile(file){
  document.getElementById("upErr").innerHTML="";
  busy("Membaca file…");
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array"});
    const mp=detectMarketplace(wb);
    const byMonth=parseWorkbook(wb,mp);
    const months=Object.keys(byMonth).sort();
    PENDING={wb,mp,byMonth,months,count:months.reduce((a,k)=>a+Object.keys(byMonth[k]).length,0),fname:file.name};
    drawConfirm();
  }catch(err){document.getElementById("upErr").innerHTML=`<div class="err">${esc(err.message||"File tidak terbaca.")}</div>`;}
  finally{ idle(); }
}
function drawConfirm(){
  const c=document.getElementById("upConfirm");
  const per=PENDING.months.length?PENDING.months.map(k=>`${mName(k)} (${Object.keys(PENDING.byMonth[k]).length} hari)`).join(", "):"tidak terbaca";
  c.innerHTML=`<div class="confirm"><div class="fname">${esc(PENDING.fname)}</div>
    <label class="fld">Marketplace<select id="pMp">${MPS.map(m=>`<option ${m===PENDING.mp?"selected":""}>${m}</option>`).join("")}</select></label>
    <p class="muted" style="font-size:12px;margin:10px 0 2px">Periode terbaca: <b>${per}</b></p>
    <button class="btn-primary" id="saveUp" style="width:100%;margin-top:10px" ${PENDING.count?"":"disabled"}>Simpan penjualan</button></div>`;
  document.getElementById("pMp").onchange=e=>{PENDING.mp=e.target.value;
    try{PENDING.byMonth=parseWorkbook(PENDING.wb,PENDING.mp);}catch(err){PENDING.byMonth={};}
    PENDING.months=Object.keys(PENDING.byMonth).sort();
    PENDING.count=PENDING.months.reduce((a,k)=>a+Object.keys(PENDING.byMonth[k]).length,0);
    drawConfirm();};
  document.getElementById("saveUp").onclick=saveUpload;
}
async function saveUpload(){
  if(!PENDING) return;
  const btn=document.getElementById("saveUp");
  if(btn){btn.classList.add("btn-busy");btn.disabled=true;}
  try{
    const months=PENDING.months;
    if(!months.length){toast("Tidak ada data yang bisa disimpan");return;}
    for(const pk of months){
      const pd=ensurePeriod(pk);
      const prev=pd.data[PENDING.mp]||{}, merged=Object.assign({},prev);
      for(const[d,v] of Object.entries(PENDING.byMonth[pk])) merged[d]=Object.assign({},prev[d]||{},v);
      pd.data[PENDING.mp]=merged;
    }
    const mp=PENDING.mp, ms=months.map(mName).join(", "), cnt=PENDING.count;
    DB.active=months[months.length-1];
    logAct(`unggah penjualan ${mp} · ${ms} (${cnt} hari)`);
    PENDING=null;
    await loadProdMonth(DB.active);
    render(); busy("Menyimpan…");
    try{ await persistAll(); toast("Tersimpan: "+mp+" · "+ms); closePanel(); }
    catch(e){ localSet(KEY,DB); toast("Gagal simpan ke database. Tersimpan sementara di peramban ini - klik Refresh lalu coba lagi."); }
    finally{ idle(); }
  }finally{ if(btn){btn.classList.remove("btn-busy");btn.disabled=false;} }
}

async function handleProdFile(file){
  document.getElementById("pErr").innerHTML="";
  busy("Membaca file…");
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array"});
    const hit=detectPreset(wb);
    if(hit){
      PPEND={wb,sheet:hit.sheet,rows:hit.rows,hi:hit.hi,mp:hit.preset.mp,wi:prodWeekIdx(),
        preset:hit.preset,level:hit.preset.levels[0].k,map:null,fname:file.name};
      drawProdMap(); return;
    }
    const sheet=wb.SheetNames[0];
    const rows=sheetMatrix(wb,sheet);
    const hi=guessHeaderRow(rows);
    let mp="Shopee";
    const blob=(file.name+" "+rows.slice(0,Math.min(6,rows.length)).flat().join(" ")).toLowerCase();
    if(blob.includes("tiktok")) mp="TikTok"; else if(blob.includes("tokopedia")) mp="Tokopedia";
    else if(blob.includes("lazada")) mp="Lazada"; else if(blob.includes("shopee")) mp="Shopee";
    PPEND={wb,sheet,rows,hi,mp,wi:prodWeekIdx(),preset:null,level:null,map:guessMapping(rows[hi]||[]),fname:file.name};
    drawProdMap();
  }catch(err){document.getElementById("pErr").innerHTML=`<div class="err">${esc(err.message||"File tidak terbaca.")}</div>`;}
  finally{ idle(); }
}
function prodParse(){
  if(PPEND.preset){
    const res=PPEND.preset.resolve(lowRow(PPEND.rows[PPEND.hi]),PPEND.rows,PPEND.hi,PPEND.level);
    return {res,items:buildProducts(PPEND.rows,PPEND.hi,res.map,res)};
  }
  return {res:null,items:buildProducts(PPEND.rows,PPEND.hi,PPEND.map)};
}
function drawProdMap(){
  const {wb,rows,hi}=PPEND;
  const {res,items}=prodParse();
  const n=Object.keys(items).length;
  const sample=Object.entries(items).slice(0,3).map(([k,v])=>`<tr><td class="l">${esc(v.n.slice(0,26))}</td><td>${rpShort(v.g)}</td><td>${num(v.u)}</td><td>${num(v.v)}</td></tr>`).join("");
  const preview=n?`<div class="ok" style="margin-top:10px">${n} produk terbaca</div>
      <div class="scroll" style="max-height:150px"><table><thead><tr><th class="l">Produk</th><th>GMV</th><th>Unit</th><th>Peng.</th></tr></thead><tbody>${sample}</tbody></table></div>`
    :`<div class="err" style="margin-top:10px">Belum ada produk terbaca. ${PPEND.preset?"Coba level yang lain atau atur kolom manual.":"Periksa baris header dan kolom Kode/Nama/GMV."}</div>`;

async function handleAdsFile(file){

  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array",cellDates:true});

    if(hit){
      APEND={wb,sheet:hit.sheet,rows:hit.rows,hi:hit.hi,ch:hit.preset.ch,
        preset:hit.preset,level:hit.preset.levels[0].k,pk:hit.pk||DB.active,map:null,mode:null,fname:file.name};
      drawAdsMap(); return;
    }

// Baris iklan dijumlahkan per bulan dan per minggu sesuai tanggalnya.
function parseAdsFile(rows,hi,map){
  const byMonth={}, byDay={}; let total={cost:0,rev:0}, dated=0, skipped=0;
  for(let r=hi+1;r<rows.length;r++){
    const row=rows[r]||[];
    // Baris ringkasan di kaki tabel tidak ikut dijumlah.
    if(row.slice(0,2).some(c=>/^(total|jumlah|grand total|keseluruhan|total keseluruhan)$/i.test(String(c||"").trim()))) continue;
    const cost=map.cost>=0?parseNum(row[map.cost]):0;
    const rev=map.rev>=0?parseNum(row[map.rev]):0;
    if(!cost&&!rev) continue;
    const dt=map.date>=0?toDate(row[map.date]):null;
    // Kolom tanggal ada tapi barisnya kosong / "-" → itu baris total, bukan data harian.
    if(map.date>=0&&!dt){ skipped++; continue; }
    total.cost+=cost; total.rev+=rev;
    if(!dt) continue;
    dated++;
    const pk=pkey(dt), i=weekIndex(pk,dt.d);
    byMonth[pk]=byMonth[pk]||{};
    byMonth[pk][i]=byMonth[pk][i]||{cost:0,rev:0};
    byMonth[pk][i].cost+=cost; byMonth[pk][i].rev+=rev;
    // Simpan juga per TANGGAL, supaya file bertanggal mengisi data harian (mingguan & bulanan otomatis diturunkan darinya).
    byDay[pk]=byDay[pk]||{};
    byDay[pk][dt.d]=byDay[pk][dt.d]||{cost:0,rev:0};
    byDay[pk][dt.d].cost+=cost; byDay[pk][dt.d].rev+=rev;
  }
  return {byMonth,byDay,total,dated,skipped};
}
function adsParse(){
  if(APEND.preset){
    const res=APEND.preset.resolve(lowRow(APEND.rows[APEND.hi]),APEND.rows,APEND.hi,APEND.level);
    return {res,parsed:parseAdsFile(APEND.rows,APEND.hi,res.map)};
  }
  return {res:null,parsed:parseAdsFile(APEND.rows,APEND.hi,APEND.map)};
}

      <label class="fld">Sheet<select id="aSh">${wb.SheetNames.map(s=>`<option ${s===APEND.sheet?"selected":""}>${esc(s)}</option>`).join("")}</select></label>
    </div>
    <label class="fld" style="margin-top:8px">Baris header<select id="aHi">
      ${rows.slice(0,Math.min(rows.length,20)).map((r,i)=>`<option value="${i}" ${i===hi?"selected":""}>Baris ${i+1}: ${esc(String(r.filter(Boolean).slice(0,4).join(" | ")).slice(0,44))}</option>`).join("")}
    </select></label>
    <p class="mini" style="margin:12px 0 6px">Cocokkan kolom:</p>
    ${ADS_FIELDS.map(f=>`<label class="fld" style="margin-bottom:6px">${f.lab}${f.req?"":" <span class='mini'>(opsional)</span>"}
      <select data-a="${f.k}">${opt(map[f.k])}</select></label>`).join("")}
    <label class="fld" style="margin-top:8px">Cara mengisi<select id="aMode">
      <option value="minggu" ${APEND.mode==="minggu"?"selected":""} ${bisaMinggu?"":"disabled"}>Pisahkan per tanggal (harian)${bisaMinggu?"":", tidak ada tanggal terbaca"}</option>
      <option value="bulan" ${APEND.mode==="bulan"?"selected":""}>Jadikan total bulanan ${mName(DB.active)}</option>
    </select></label>
    ${ada?`<div class="ok" style="margin-top:10px">${parsed.dated?parsed.dated+" baris bertanggal terbaca":"Total file terbaca"}${parsed.skipped&&APEND.mode==="minggu"?` · ${parsed.skipped} baris tanpa tanggal diabaikan`:""}</div>${rincian}`
      :`<div class="err" style="margin-top:10px">Belum ada angka terbaca. Periksa baris header dan kolom biaya/omzet.</div>`}
    <button class="btn-primary" id="aSave" style="width:100%;margin-top:12px" ${ada?"":"disabled"}>Simpan iklan</button>
    <p class="mini" style="margin:8px 0 0">Angka lama untuk channel dan periode yang sama akan ditimpa.</p></div>`;
  document.getElementById("aCh").onchange=e=>{APEND.ch=e.target.value;drawAdsMap();};
  document.getElementById("aSh").onchange=e=>{
    APEND.sheet=e.target.value;APEND.rows=sheetMatrix(APEND.wb,APEND.sheet);
    APEND.hi=guessHeaderRow(APEND.rows,ADS_FIELDS);
    APEND.map=guessMapping(APEND.rows[APEND.hi]||[],ADS_FIELDS);APEND.mode=null;drawAdsMap();};
  document.getElementById("aHi").onchange=e=>{
    APEND.hi=+e.target.value;APEND.map=guessMapping(APEND.rows[APEND.hi]||[],ADS_FIELDS);drawAdsMap();};
  document.getElementById("aMode").onchange=e=>{APEND.mode=e.target.value;drawAdsMap();};
  document.querySelectorAll("#aMap select[data-a]").forEach(s=>s.onchange=()=>{
    APEND.map=Object.assign({},APEND.map,{[s.dataset.a]:+s.value});APEND.mode=null;drawAdsMap();});
  const b=document.getElementById("aSave"); if(b) b.onclick=saveAdsUpload;
}
async function saveAdsUpload(){
  if(!APEND||!APEND.parsed) return;
  const btn=document.getElementById("aSave");
  if(btn){btn.classList.add("btn-busy");btn.disabled=true;}
  try{
    const {byMonth,byDay,total}=APEND.parsed, ch=APEND.ch;
    let pesan="";
    if(APEND.mode==="minggu"){
      // File bertanggal → tulis ke data HARIAN per tanggal. Mingguan & bulanan otomatis diturunkan.
      const src=byDay||{};
      const months=Object.keys(src).sort();
      for(const pk of months){
        const pd=ensurePeriod(pk);
        pd.ads[ch]=pd.ads[ch]||{m:{cost:0,rev:0},w:{},d:{}};
        pd.ads[ch].d=pd.ads[ch].d||{};
        for(const day of Object.keys(src[pk])) pd.ads[ch].d[day]=src[pk][day];
        // harian jadi sumber tunggal; kosongkan ringkasan manual biar tidak dobel dihitung
        pd.ads[ch].w={};
        pd.ads[ch].m={cost:0,rev:0};
      }
      DB.active=months[months.length-1];
      pesan=`Iklan ${ch} · ${months.map(mName).join(", ")} tersimpan`;
      logAct(`unggah iklan ${ch} · ${months.map(mName).join(", ")} (harian dari file)`);
    }else{
      const pk=(APEND.preset&&APEND.pk)||DB.active;
      const pd=ensurePeriod(pk);
      pd.ads[ch]=pd.ads[ch]||{m:{cost:0,rev:0},w:{}};
      pd.ads[ch].m={cost:total.cost,rev:total.rev};
      DB.active=pk;
      pesan=`Iklan ${ch} · ${mName(pk)} tersimpan`;
      logAct(`unggah iklan ${ch} · ${mName(pk)} (total bulanan)`);
    }
    APEND=null;
    render(); busy("Menyimpan…");
    try{ await persistAll(); toast(pesan); closePanel(); }
    catch(e){ localSet(KEY,DB); toast("Gagal simpan ke database. Tersimpan sementara di peramban ini - klik Refresh lalu coba lagi."); }
    finally{ idle(); }
  }finally{ if(btn){btn.classList.remove("btn-busy");btn.disabled=false;} }
}

      <label class="fld" style="display:block;margin-bottom:8px"><input type="radio" name="impMode" value="merge" checked> Gabungkan - baris yang sama ditimpa, sisanya ditambah</label>
      <label class="fld" style="display:block;margin-bottom:14px"><input type="radio" name="impMode" value="replace"> Ganti semua - database diisi ulang dari file</label>

async function exportDb(){
  busy("Menyiapkan file Excel…");
  try{
    const dataRows=[["Bulan","Marketplace","Tanggal","GMV","Pembatalan","Pengembalian","GMV Bersih","Pesanan","Pesanan Batal","Pesanan Retur","Pengunjung"]];
    const tgtRows=[["Bulan","Target GMV"]];
    const adsRows=[["Bulan","Channel","Periode","Biaya Iklan","Omzet Iklan"]];
    const prodRowsX=[["Bulan","Minggu","Marketplace","SKU","Nama Produk","GMV","Unit","Pengunjung","Pesanan","Harga","Stok"]];
    for(const pk of Object.keys(DB.periods).sort()){
      const pd=DB.periods[pk];
      tgtRows.push([pk,pd.target||0]);
      for(const m of MPS){
        const md=pd.data[m]||{};
        for(const d of Object.keys(md).map(Number).sort((a,b)=>a-b)){
          const x=md[d]||{},g=x.gmv||0,cv=x.cancelVal||0,rv=x.retVal||0;
          dataRows.push([pk,m,d,g,cv,rv,g-cv-rv,x.pesanan||0,x.cancelQty||0,x.retQty||0,x.pengunjung||0]);
        }
      }
      for(const k of AD_KEYS){
        const a=(pd.ads||{})[k]||{};
        if(a.m&&(a.m.cost||a.m.rev)) adsRows.push([pk,k,"Bulanan",a.m.cost||0,a.m.rev||0]);
        for(const i of Object.keys(a.w||{}).sort((x,y)=>x-y)){
          const w=a.w[i]||{}; if(w.cost||w.rev) adsRows.push([pk,k,"M"+(Number(i)+1),w.cost||0,w.rev||0]);
        }
        for(const day of Object.keys(a.d||{}).sort((x,y)=>x-y)){
          const x=a.d[day]||{}; if(x.cost||x.rev) adsRows.push([pk,k,"H"+day,x.cost||0,x.rev||0]);
        }
      }
      const pm=PROD[pk];
      if(pm) for(const m of MPS){const byW=pm[m]||{};
        for(const wk of Object.keys(byW)){const items=byW[wk]||{};
          for(const sku of Object.keys(items)){const v=items[sku]||{};
            prodRowsX.push([pk,"M"+(Number(wk)+1),m,sku,v.n||"",v.g||0,v.u||0,v.v||0,v.o||0,v.p||0,v.s||0]);}}}
    }
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(dataRows),"Data");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(tgtRows),"Target");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(adsRows),"Iklan");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(prodRowsX),"Produk");
    const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
    const fname="gmv-demo-database-"+new Date().toISOString().slice(0,10)+".xlsx";
    idle();
    if(DLCAP){
      try{ await DLCAP.save({filename:fname,data:out}); toast("Database diekspor"); }
      catch(err){ if(err&&err.code==="declined") return; toast("Ekspor gagal - coba lagi"); }
      return;
    }
    const blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=fname;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast("Database diekspor");
  }finally{ idle(); }
}
async function importDb(file,mode){
  busy("Membaca file…");
  try{
    const buf=await file.arrayBuffer();
    let wb; try{wb=XLSX.read(buf,{type:"array"});}catch(e){throw new Error("File Excel tidak terbaca.");}
    const sheetRows=n=>{const ws=wb.Sheets[n];return ws?XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false}):null;};
    const rows=sheetRows("Data")||sheetRows(wb.SheetNames[0]);
    if(!rows||!rows.length) throw new Error("Sheet 'Data' tidak ada atau kosong.");
    const hdr=rows[0].map(x=>String(x).toLowerCase().trim());
    const col=n=>hdr.indexOf(n);
    const ci={bulan:col("bulan"),mp:col("marketplace"),tgl:col("tanggal"),gmv:col("gmv"),
      batal:col("pembatalan"),retur:col("pengembalian"),pes:col("pesanan"),
      pbatal:col("pesanan batal"),pretur:col("pesanan retur"),peng:col("pengunjung")};
    if(ci.bulan<0||ci.mp<0||ci.tgl<0) throw new Error("Kolom Bulan/Marketplace/Tanggal tidak lengkap di sheet 'Data'.");
    const inc={active:DB.active,periods:{}};
    const ens=pk=>{if(!inc.periods[pk])inc.periods[pk]={data:emptyData(),target:0,ads:emptyAds()};return inc.periods[pk];};
    const g=(r,i)=>i>=0?parseNum(r[i]):0;
    for(let r=1;r<rows.length;r++){
      const row=rows[r],pk=String(row[ci.bulan]||"").trim();
      if(!/^\d{4}-\d{2}$/.test(pk)) continue;
      const m=String(row[ci.mp]||"").trim(), d=parseInt(row[ci.tgl],10);
      if(!MPS.includes(m)||!d) continue;
      ens(pk).data[m][d]={gmv:g(row,ci.gmv),cancelVal:g(row,ci.batal),retVal:g(row,ci.retur),
        pesanan:g(row,ci.pes),cancelQty:g(row,ci.pbatal),retQty:g(row,ci.pretur),pengunjung:g(row,ci.peng)};
    }
    const tr=sheetRows("Target");
    if(tr&&tr.length){const th=tr[0].map(x=>String(x).toLowerCase().trim());
      const b=th.indexOf("bulan"),t=th.indexOf("target gmv");
      if(b>=0&&t>=0) for(let r=1;r<tr.length;r++){const pk=String(tr[r][b]||"").trim();
        if(/^\d{4}-\d{2}$/.test(pk)) ens(pk).target=parseNum(tr[r][t]);}}
    const ar=sheetRows("Iklan");
    if(ar&&ar.length){const ah=ar[0].map(x=>String(x).toLowerCase().trim());
      const b=ah.indexOf("bulan"),m=ah.indexOf("channel")>=0?ah.indexOf("channel"):ah.indexOf("marketplace"),
            p=ah.indexOf("periode"),c=ah.indexOf("biaya iklan"),v=ah.indexOf("omzet iklan");
      if(b>=0&&m>=0&&p>=0) for(let r=1;r<ar.length;r++){
        const pk=String(ar[r][b]||"").trim(), per=String(ar[r][p]||"").trim();
        const k=adsKeyOf(ar[r][m]);   // menerima "Shopee", "TikTok+Tokopedia", atau nama lama per marketplace
        if(!/^\d{4}-\d{2}$/.test(pk)||!k) continue;
        const pd=ens(pk); pd.ads[k]=pd.ads[k]||{m:{cost:0,rev:0},w:{},d:{}};
        const rec={cost:parseNum(ar[r][c]),rev:parseNum(ar[r][v])};
        if(/^bulanan$/i.test(per)){ pd.ads[k].m={cost:pd.ads[k].m.cost+rec.cost,rev:pd.ads[k].m.rev+rec.rev}; }
        else {const mm=per.match(/^m(\d+)$/i), dm=per.match(/^h(\d+)$/i);
          if(mm){const i=+mm[1]-1, prev=pd.ads[k].w[i]||{cost:0,rev:0};
            pd.ads[k].w[i]={cost:prev.cost+rec.cost,rev:prev.rev+rec.rev};}
          else if(dm){const day=+dm[1]; pd.ads[k].d=pd.ads[k].d||{}; const prev=pd.ads[k].d[day]||{cost:0,rev:0};
            pd.ads[k].d[day]={cost:prev.cost+rec.cost,rev:prev.rev+rec.rev};}}
      }}
    const pr=sheetRows("Produk");
    const incProd={};
    if(pr&&pr.length){const ph=pr[0].map(x=>String(x).toLowerCase().trim());
      const idx=n=>ph.indexOf(n);
      const b=idx("bulan"),wk=idx("minggu"),m=idx("marketplace"),s=idx("sku"),nm=idx("nama produk");
      if(b>=0&&m>=0&&s>=0) for(let r=1;r<pr.length;r++){
        const pk=String(pr[r][b]||"").trim(), mp=String(pr[r][m]||"").trim(), sku=String(pr[r][s]||"").trim();
        if(!/^\d{4}-\d{2}$/.test(pk)||!MPS.includes(mp)||!sku) continue;
        const wmm=wk>=0?String(pr[r][wk]||"").trim().match(/(\d+)/):null; const wi=wmm?(+wmm[1]-1):0;
        incProd[pk]=incProd[pk]||{}; incProd[pk][mp]=incProd[pk][mp]||{}; incProd[pk][mp][wi]=incProd[pk][mp][wi]||{};
        incProd[pk][mp][wi][sku]={n:String(pr[r][nm]||sku),g:parseNum(pr[r][idx("gmv")]),u:parseNum(pr[r][idx("unit")]),
          v:parseNum(pr[r][idx("pengunjung")]),o:parseNum(pr[r][idx("pesanan")]),
          p:parseNum(pr[r][idx("harga")]),s:parseNum(pr[r][idx("stok")])};
      }}
    const obj=migrate(inc);
    if(!obj||!Object.keys(obj.periods).length) throw new Error("Tidak ada data yang terbaca dari file.");
    if(mode==="replace"){ DB=obj; PROD={}; }
    else { for(const pk of Object.keys(obj.periods)){
        const ip=obj.periods[pk], bp=ensurePeriod(pk);
        if(ip.target) bp.target=ip.target;
        for(const m of MPS) Object.assign(bp.data[m],ip.data[m]||{});
        for(const k of AD_KEYS){ const ia=ip.ads[k]; if(!ia) continue;
          if(ia.m&&(ia.m.cost||ia.m.rev)) bp.ads[k].m=ia.m;
          bp.ads[k].w=Object.assign({},bp.ads[k].w,ia.w||{});
          bp.ads[k].d=Object.assign({},bp.ads[k].d,ia.d||{}); } } }
    for(const pk of Object.keys(incProd)){
      PROD[pk]=PROD[pk]||{};
      for(const mp of Object.keys(incProd[pk])){
        PROD[pk][mp]=PROD[pk][mp]||{};
        for(const wi of Object.keys(incProd[pk][mp]))
          PROD[pk][mp][wi]=mode==="replace"?incProd[pk][mp][wi]:Object.assign({},PROD[pk][mp][wi]||{},incProd[pk][mp][wi]);
      }
    }
    if(!DB.periods[DB.active]) DB.active=Object.keys(DB.periods).sort().slice(-1)[0];
    logAct(`impor Excel (${mode==="replace"?"ganti semua":"gabungkan"})`);
    for(const pk of Object.keys(incProd)){ try{ await saveProd(pk); }catch(e){} }
    await loadProdMonth(DB.active);
    commitAll(mode==="replace"?"Database diganti dari Excel":"Database digabung dari Excel");
  }finally{ idle(); }
}

/* ============================ Toast & indikator ============================ */
let toastT=null;
function toast(msg){let el=document.getElementById("toast");if(el)el.remove();
  el=document.createElement("div");el.id="toast";el.className="toast";el.textContent=msg;document.body.appendChild(el);
  clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),3000);}
let busyN=0;
function busy(msg){busyN++;let el=document.getElementById("busy");
  if(!el){el=document.createElement("div");el.id="busy";el.className="busy";document.body.appendChild(el);}
  el.innerHTML=`<span class="spin"></span>${esc(msg||"Memproses…")}`;}
function idle(){busyN=Math.max(0,busyN-1);if(busyN===0){const el=document.getElementById("busy");if(el)el.remove();}}

/* ============================ Boot ============================ */
(async function(){
  try{ ME=localStorage.getItem(MEKEY)||""; }catch(e){ ME=""; }
  busy("Memuat database…");
  try{
    await initCaps();
    const loaded=await loadDb();
    DB=(loaded&&migrate(loaded))||freshDb();
    HIST=await loadHist();
    await loadProdMonth(DB.active);
    render();
  }catch(e){
    DB=DB||freshDb(); render(); toast("Database belum bisa dimuat - data yang kamu isi tersimpan sementara di peramban ini.");
  }finally{ idle(); }
})();
